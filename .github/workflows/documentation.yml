name: Distribution Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    uses: flytohub/.github/.github/workflows/reusable-documentation.yml@main

  verify:
    name: Verify distribution metadata and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint Markdown and patch hygiene
        run: |
          git diff --check
          test -s README.md
          test -s SECURITY.md
          test -s docs/README.md
          test -s docs/DISTRIBUTION.md
          test -s docs/SUPPLY_CHAIN.md
          test -s products/catalog.json
          test -s release-policy.json
          test -s schemas/release-manifest.schema.json

      - name: Test Markdown links and distribution contract
        run: python3 scripts/verify.py

      - name: Build documentation bundle for distribution contract
        run: |
          mkdir -p out
          COPYFILE_DISABLE=1 tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -czf out/flyto2-distribution-contract.tar.gz --             *.md docs products schemas workflows handoffs release-policy.json
          tar -tzf out/flyto2-distribution-contract.tar.gz >/dev/null

      - name: Strict Flyto2 Indexer verification
        run: |
          python -m pip install "flyto-indexer @ git+https://github.com/flytohub/flyto-indexer@1b624987b15ef7cd2361370478d07ea36e5aa5ee"
          flyto-index verify . --full-scan --strict --json
