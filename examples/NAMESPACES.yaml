# ============================================================================
# Module Naming Rules
# ============================================================================
naming_rules:

  # Standard format for third-party services
  format: "{namespace}.{vendor}.{action}"

  examples:
    - "ai.openai.chat"           # AI namespace, OpenAI vendor, chat action
    - "cloud.aws.s3.upload"      # Cloud namespace, AWS vendor, S3 service, upload action
    - "notify.slack.message"     # Notify namespace, Slack vendor, message action
    - "db.postgres.query"        # DB namespace, Postgres vendor, query action

  # Core modules (built-in, no vendor)
  core_format: "core.{category}.{action}"

  core_examples:
    - "core.browser.launch"      # Core, browser category, launch action
    - "core.data.transform"      # Core, data category, transform action
    - "core.file.read"           # Core, file category, read action

  # Naming conventions
  rules:
    - "Use lowercase only"
    - "Use dots (.) as separators"
    - "Vendor name required for third-party services"
    - "Action should be a verb (e.g., send, get, create, delete)"
    - "Maximum 4 levels deep (namespace.vendor.service.action)"
    - "Be descriptive but concise"
    - "Follow existing patterns in the same category"

  # Bad examples (avoid these)
  bad_examples:
    - "openai_chat"              # No namespace
    - "ai.chat"                  # Missing vendor
    - "AI.OpenAI.Chat"           # Should be lowercase
    - "ai-openai-chat"           # Use dots, not dashes
    - "ai.openai.chatCompletion" # Use snake_case, not camelCase

