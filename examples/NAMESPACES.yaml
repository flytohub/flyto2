    description:
      en: "Built-in modules for browser, data, and file operations"
      zh: "'sData and File Operation Modules"
      ja: "Operations"
    icon: ""
    maintainer: "core-team"
    categories:
      browser:
        name: "Browser Automation"
        description: "Web browser automation using Playwright"
        examples:
          - "core.browser.launch"
          - "core.browser.goto"
          - "core.browser.click"
          - "core.browser.type"
          - "core.browser.extract"
      data:
        name: "Data Processing"
        description: "Data transformation and manipulation"
        examples:
          - "core.data.transform"
          - "core.data.filter"
          - "core.data.merge"
          - "core.data.aggregate"
      file:
        name: "File Operations"
        description: "File system operations"
        examples:
          - "core.file.read"
          - "core.file.write"
          - "core.file.download"
          - "core.file.upload"
      logic:
        name: "Control Flow"
        description: "Logic and control flow operations"
        examples:
          - "core.logic.if"
          - "core.logic.loop"
          - "core.logic.switch"
          - "core.logic.wait"

