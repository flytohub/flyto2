# ============================================================================
# Workflow Engine - Global Configuration
# ============================================================================
#
# This file contains global settings that apply to all workflows.
# Individual workflows can override these settings in their workflow.yaml
#
# Priority: CLI args > Workflow config > Global config > Defaults
# ============================================================================

engine:
  name: "Workflow Automation Engine"
  version: "1.0.0"
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL

# Browser Configuration
browser:
  type: "chromium"  # chromium, firefox, webkit
  headless: false
  slow_mo: 0  # Milliseconds between actions (useful for debugging)
  viewport:
    width: 1920
    height: 1080
  args:
    - "--disable-blink-features=AutomationControlled"
    - "--disable-dev-shm-usage"
    - "--no-sandbox"

# Anti-Detection & Human Simulation
anti_detection:
  enabled: true
  stealth_mode: true  # Use stealth techniques
  random_delays:
    enabled: true
    min_ms: 100
    max_ms: 500
  human_mouse_movement: false
  rotate_user_agent: false
  webrtc_leak_prevention: true

# Proxy Configuration
proxy:
  enabled: false
  url: null  # "http://proxy.example.com:8080"
  username: null
  password: null
  rotate: false

# Performance & Retry Settings
performance:
  timeout: 30000  # Default timeout in milliseconds
  navigation_timeout: 60000
  max_retries: 3
  retry_delay: 1000  # Milliseconds between retries
  concurrent_workflows: 5

# Storage Settings
storage:
  output_dir: "./output"
  screenshot_dir: "./screenshots"
  cache_dir: "./cache"
  auto_create_dirs: true

# Localization
locale:
  default: "en"  # en, zh, ja
  timezone: "UTC"
  date_format: "%Y-%m-%d"
  time_format: "%H:%M:%S"

# Logging
logging:
  console: true
  file: false
  file_path: "./logs/workflow-engine.log"
  max_size: "10MB"
  backup_count: 5
  format: "[{time}] {level}: {message}"

# API Keys (use environment variables for production)
# These are loaded from environment variables
api_keys:
  openai: "${OPENAI_API_KEY}"
  anthropic: "${ANTHROPIC_API_KEY}"
  google: "${GOOGLE_API_KEY}"
  aws_access_key: "${AWS_ACCESS_KEY_ID}"
  aws_secret_key: "${AWS_SECRET_ACCESS_KEY}"

# Security
security:
  allow_unsafe_yaml: false
  max_workflow_duration: 3600  # Maximum workflow execution time in seconds
  max_file_size: 104857600  # 100MB in bytes
  allowed_protocols: ["http", "https"]
