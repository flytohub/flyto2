name: "Test array.map Module"
description: "Validates array.map module functionality"

steps:
  - id: test_double_numbers
    module: array.map
    params:
      array: [1, 2, 3, 4, 5]
      transform: "${item * 2}"

  - id: assert_doubled
    module: test.assert_equal
    params:
      actual: "${test_double_numbers.result}"
      expected: [2, 4, 6, 8, 10]
      message: "Should double all numbers"

  - id: test_string_uppercase
    module: array.map
    params:
      array: ["hello", "world"]
      transform: "${item.upper()}"

  - id: assert_uppercase
    module: test.assert_equal
    params:
      actual: "${test_string_uppercase.result}"
      expected: ["HELLO", "WORLD"]
      message: "Should convert strings to uppercase"

  - id: test_empty_array
    module: array.map
    params:
      array: []
      transform: "${item * 2}"

  - id: assert_empty_result
    module: test.assert_length
    params:
      collection: "${test_empty_array.result}"
      expected_length: 0
      message: "Empty array should return empty result"

  - id: test_single_element
    module: array.map
    params:
      array: [10]
      transform: "${item + 5}"

  - id: assert_single_transformed
    module: test.assert_equal
    params:
      actual: "${test_single_element.result[0]}"
      expected: 15
      message: "Single element should be transformed correctly"

  - id: test_object_transformation
    module: array.map
    params:
      array:
        - name: "Alice"
          age: 30
        - name: "Bob"
          age: 25
      transform: "${item.name}"

  - id: assert_names_extracted
    module: test.assert_equal
    params:
      actual: "${test_object_transformation.result}"
      expected: ["Alice", "Bob"]
      message: "Should extract names from objects"
