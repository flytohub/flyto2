name: "Test data.json.parse Module"
description: "Validates JSON parsing functionality"

steps:
  - id: test_simple_object
    module: data.json.parse
    params:
      json_string: '{"name": "Alice", "age": 30}'

  - id: assert_name
    module: test.assert_equal
    params:
      actual: "${test_simple_object.data.name}"
      expected: "Alice"
      message: "Should parse name correctly"

  - id: assert_age
    module: test.assert_equal
    params:
      actual: "${test_simple_object.data.age}"
      expected: 30
      message: "Should parse age correctly"

  - id: test_array
    module: data.json.parse
    params:
      json_string: '[1, 2, 3, 4, 5]'

  - id: assert_array_length
    module: test.assert_length
    params:
      collection: "${test_array.data}"
      expected_length: 5
      message: "Should parse array with 5 elements"

  - id: assert_array_value
    module: test.assert_equal
    params:
      actual: "${test_array.data[2]}"
      expected: 3
      message: "Third element should be 3"

  - id: test_nested_object
    module: data.json.parse
    params:
      json_string: '{"user": {"name": "Bob", "email": "bob@example.com"}}'

  - id: assert_nested_name
    module: test.assert_equal
    params:
      actual: "${test_nested_object.data.user.name}"
      expected: "Bob"
      message: "Should parse nested name"

  - id: test_boolean
    module: data.json.parse
    params:
      json_string: '{"active": true, "deleted": false}'

  - id: assert_boolean_true
    module: test.assert_true
    params:
      condition: "${test_boolean.data.active}"
      message: "Should parse true boolean"

  - id: test_null_value
    module: data.json.parse
    params:
      json_string: '{"value": null}'

  - id: assert_null
    module: test.assert_equal
    params:
      actual: "${test_null_value.data.value}"
      expected: null
      message: "Should handle null values"

  - id: test_number_types
    module: data.json.parse
    params:
      json_string: '{"int": 42, "float": 3.14, "negative": -10}'

  - id: assert_integer
    module: test.assert_equal
    params:
      actual: "${test_number_types.data.int}"
      expected: 42

  - id: assert_float
    module: test.assert_equal
    params:
      actual: "${test_number_types.data.float}"
      expected: 3.14

  - id: test_empty_object
    module: data.json.parse
    params:
      json_string: '{}'

  - id: test_empty_array
    module: data.json.parse
    params:
      json_string: '[]'

  - id: assert_empty_array_length
    module: test.assert_length
    params:
      collection: "${test_empty_array.data}"
      expected_length: 0
