name: "Test math.sum Module"
description: "Validates mathematical sum operations"

steps:
  - id: test_positive_numbers
    module: math.sum
    params:
      numbers: [1, 2, 3, 4, 5]

  - id: assert_positive_sum
    module: test.assert_equal
    params:
      actual: "${test_positive_numbers.sum}"
      expected: 15
      message: "Sum of 1+2+3+4+5 should be 15"

  - id: test_negative_numbers
    module: math.sum
    params:
      numbers: [-1, -2, -3]

  - id: assert_negative_sum
    module: test.assert_equal
    params:
      actual: "${test_negative_numbers.sum}"
      expected: -6
      message: "Sum of negative numbers should work"

  - id: test_mixed_numbers
    module: math.sum
    params:
      numbers: [10, -5, 3, -2]

  - id: assert_mixed_sum
    module: test.assert_equal
    params:
      actual: "${test_mixed_numbers.sum}"
      expected: 6
      message: "Mixed positive/negative should work"

  - id: test_single_number
    module: math.sum
    params:
      numbers: [42]

  - id: assert_single
    module: test.assert_equal
    params:
      actual: "${test_single_number.sum}"
      expected: 42
      message: "Single number should return itself"

  - id: test_zero
    module: math.sum
    params:
      numbers: [0, 0, 0]

  - id: assert_zero_sum
    module: test.assert_equal
    params:
      actual: "${test_zero.sum}"
      expected: 0
      message: "Sum of zeros should be zero"

  - id: test_empty_array
    module: math.sum
    params:
      numbers: []

  - id: assert_empty_sum
    module: test.assert_equal
    params:
      actual: "${test_empty_array.sum}"
      expected: 0
      message: "Empty array should sum to 0"

  - id: test_decimals
    module: math.sum
    params:
      numbers: [1.5, 2.5, 3.0]

  - id: assert_decimal_sum
    module: test.assert_equal
    params:
      actual: "${test_decimals.sum}"
      expected: 7.0
      message: "Decimal numbers should sum correctly"

  - id: test_large_numbers
    module: math.sum
    params:
      numbers: [1000, 2000, 3000]

  - id: assert_large_sum
    module: test.assert_equal
    params:
      actual: "${test_large_numbers.sum}"
      expected: 6000
      message: "Large numbers should sum correctly"
