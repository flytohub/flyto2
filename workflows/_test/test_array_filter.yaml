name: "Test array.filter"
description: "Verify array filter functionality"

steps:
  - id: test_filter_greater_than
    module: array.filter
    params:
      array: [1, 2, 3, 4, 5, 6]
      condition: "gt"
      value: 3

  - id: test_filter_less_than
    module: array.filter
    params:
      array: [1, 2, 3, 4, 5, 6]
      condition: "lt"
      value: 4

  - id: test_filter_equal
    module: array.filter
    params:
      array: [1, 2, 3, 3, 4, 5]
      condition: "eq"
      value: 3
