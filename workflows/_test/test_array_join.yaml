name: "Test array.join"
description: "Verify array join functionality"

steps:
  - id: test_comma_join
    module: array.join
    params:
      array: ["apple", "banana", "cherry"]
      separator: ", "

  - id: test_space_join
    module: array.join
    params:
      array: ["hello", "world"]
      separator: " "

  - id: test_empty_array
    module: array.join
    params:
      array: []
      separator: ", "
