name: "Test array.map"
description: "Verify array map functionality"

steps:
  - id: test_double_numbers
    module: array.map
    params:
      array: [1, 2, 3, 4, 5]
      expression: "item * 2"

  - id: test_string_length
    module: array.map
    params:
      array: ["hello", "world", "test"]
      expression: "len(item)"

  - id: test_empty_array
    module: array.map
    params:
      array: []
      expression: "item * 2"
