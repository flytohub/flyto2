name: "Test array.sort"
description: "Verify array sorting functionality"

steps:
  - id: test_sort_numbers
    module: array.sort
    params:
      array: [5, 2, 8, 1, 9]
      ascending: true

  - id: test_sort_descending
    module: array.sort
    params:
      array: [5, 2, 8, 1, 9]
      ascending: false

  - id: test_already_sorted
    module: array.sort
    params:
      array: [1, 2, 3, 4, 5]
      ascending: true
