name: "Test Assertion Modules"
description: "Verify test.assert modules are working"

steps:
  - id: test_equal_pass
    module: test.assert_equal
    params:
      actual: 5
      expected: 5
      message: "test.assert_equal should pass when values match"

  - id: test_true_pass
    module: test.assert_true
    params:
      condition: true
      message: "test.assert_true should pass when condition is true"

  - id: test_length_pass
    module: test.assert_length
    params:
      collection: [1, 2, 3]
      expected_length: 3
      message: "test.assert_length should pass when length matches"

  - id: test_not_null_pass
    module: test.assert_not_null
    params:
      value: "some value"
      message: "test.assert_not_null should pass when value is not null"

  - id: test_contains_pass
    module: test.assert_contains
    params:
      collection: ["apple", "banana", "orange"]
      value: "banana"
      message: "test.assert_contains should pass when value is in collection"
