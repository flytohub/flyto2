name: "Test data.json.stringify"
description: "Verify JSON stringification"

steps:
  - id: test_simple_object
    module: data.json.stringify
    params:
      data:
        name: "Alice"
        age: 30

  - id: test_array
    module: data.json.stringify
    params:
      data: [1, 2, 3, 4, 5]

  - id: test_nested
    module: data.json.stringify
    params:
      data:
        user:
          name: "Bob"
          settings:
            theme: "dark"
