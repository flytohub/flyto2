name: "Test object.merge"
description: "Verify object merging functionality"

steps:
  - id: test_simple_merge
    module: object.merge
    params:
      objects:
        - name: "Alice"
          age: 30
        - city: "NYC"
          country: "USA"

  - id: test_override
    module: object.merge
    params:
      objects:
        - name: "Alice"
          age: 30
        - age: 31

  - id: test_empty_merge
    module: object.merge
    params:
      objects:
        - {}
        - name: "Bob"
