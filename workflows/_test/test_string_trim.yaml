name: "Test string.trim"
description: "Verify string trim functionality"

steps:
  - id: test_basic_trim
    module: string.trim
    params:
      text: "  hello world  "

  - id: test_newlines
    module: string.trim
    params:
      text: "\n\nhello\n\n"

  - id: test_already_trimmed
    module: string.trim
    params:
      text: "hello"
