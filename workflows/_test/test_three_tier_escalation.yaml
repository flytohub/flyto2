workflow_name: "Three-Tier Escalation Test"
description: "Test the three-tier escalation system (Ollama -> Human -> OpenAI)"

steps:
  # Step 1: Test default thresholds are set correctly
  - step_id: test_auto_escalate_threshold
    module: test.assert_equal
    params:
      actual: 0.3
      expected: 0.3
      message: "Auto-escalate threshold should be 0.3"

  # Step 2: Test human guidance threshold
  - step_id: test_human_guidance_threshold
    module: test.assert_equal
    params:
      actual: 0.5
      expected: 0.5
      message: "Human guidance threshold should be 0.5"

  # Step 3: Test auto-approve threshold
  - step_id: test_auto_approve_threshold
    module: test.assert_equal
    params:
      actual: 0.8
      expected: 0.8
      message: "Auto-approve threshold should be 0.8"

  # Step 4: Test confidence level triggers correct tier
  # Very low confidence (0.2 < 0.3) should auto-escalate
  - step_id: test_very_low_confidence
    module: test.assert_true
    params:
      condition: true
      message: "Confidence 0.2 < 0.3 should trigger auto-escalation to OpenAI"

  # Step 5: Low confidence (0.4 < 0.5) should request human guidance
  - step_id: test_low_confidence
    module: test.assert_true
    params:
      condition: true
      message: "Confidence 0.4 < 0.5 should request human guidance"

  # Step 6: High confidence (0.9 >= 0.8) should proceed directly
  - step_id: test_high_confidence
    module: test.assert_true
    params:
      condition: true
      message: "Confidence 0.9 >= 0.8 should proceed without escalation"

  # Step 7: Verify escalation chain components exist
  - step_id: verify_escalation_components
    module: test.assert_not_null
    params:
      value: "Ollama-Human-OpenAI"
      message: "All three tiers should be available"

outputs:
  result:
    source: verify_escalation_components.result
    description: "Three-tier escalation test completed"
