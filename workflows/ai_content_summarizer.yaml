# AI Content Summarizer
# Scrape webpage content and generate AI summary
# Demonstrates: Browser + AI integration

id: ai-content-summarizer
name: "AI Content Summarizer"
version: "1.0.0"
description: "Extract article content from any webpage and generate AI summary"
author: "Flyto2 Team"
tags: ["ai", "browser", "openai", "summarization", "example"]

# User parameters
params:
  - name: article_url
    type: string
    label: "Article URL"
    description: "URL of the article to summarize"
    required: true
    placeholder: "https://example.com/article"

  - name: summary_length
    type: string
    label: "Summary Length"
    description: "Desired summary length"
    required: false
    default: "short"
    enum:
      - "short"
      - "medium"
      - "detailed"

# Workflow configuration
config:
  browser:
    headless: true

# Workflow steps
steps:
  # === Browser Setup ===
  - id: launch_browser
    module: core.browser.launch
    description: "Launch headless browser"
    params:
      headless: true

  # === Navigate to Article ===
  - id: navigate
    module: core.browser.goto
    description: "Navigate to article URL"
    params:
      browser: "${launch_browser.browser}"
      url: "${params.article_url}"
      wait_until: "networkidle"
    timeout_ms: 15000

  # === Extract Article Content ===
  - id: extract_content
    module: core.browser.extract
    description: "Extract article title and content"
    params:
      browser: "${launch_browser.browser}"
      selector: "article, main, .post-content, .article-content, .entry-content"
      fields:
        title:
          selector: "h1, .title, .post-title"
          type: "text"
        content:
          selector: "p"
          type: "text"
          multiple: true
        author:
          selector: ".author, .byline, [rel='author']"
          type: "text"
        publish_date:
          selector: "time, .date, .published"
          type: "text"

  # === Generate AI Summary ===
  - id: ai_summary
    module: ai.openai.chat
    description: "Generate summary using OpenAI"
    params:
      api_key: "${env.OPENAI_API_KEY}"
      model: "gpt-4"
      messages:
        - role: "system"
          content: "You are a professional content summarizer. Create concise, accurate summaries."
        - role: "user"
          content: |
            Summarize this article in ${params.summary_length} format:

            Title: ${extract_content.data[0].title}
            Content: ${extract_content.data[0].content}

            Provide:
            1. Main topic (one sentence)
            2. Key points (3-5 bullet points)
            3. Conclusion (one sentence)
    timeout_ms: 30000

  # === Take Screenshot (optional) ===
  - id: screenshot
    module: core.browser.screenshot
    description: "Take screenshot of article"
    params:
      browser: "${launch_browser.browser}"
      path: "article_${timestamp}.png"
      full_page: true

  # === Close Browser ===
  - id: close_browser
    module: core.browser.close
    description: "Close browser"
    params:
      browser: "${launch_browser.browser}"

# Output
output:
  url: "${params.article_url}"
  title: "${extract_content.data[0].title}"
  author: "${extract_content.data[0].author}"
  publish_date: "${extract_content.data[0].publish_date}"
  summary: "${ai_summary.message}"
  screenshot: "${screenshot.filepath}"
  processed_at: "${timestamp}"