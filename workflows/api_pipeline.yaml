# API Pipeline Example - No Browser Required
# Demonstrates pure API/HTTP workflows without browser automation

id: api-pipeline-example
name: "API Data Pipeline"
version: "1.0.0"
description: "Fetch data from multiple APIs, transform, and send to webhook"
author: "Flyto2 Team"
tags: ["api", "http", "no-browser", "example"]

# User parameters
params:
  - name: user_id
    type: string
    label: "User ID"
    description: "The user ID to fetch data for"
    required: true
    placeholder: "12345"

  - name: webhook_url
    type: string
    label: "Webhook URL"
    description: "Where to send the final result"
    required: false
    default: "https://webhook.site/your-unique-url"

# Pure API workflow - no browser needed
steps:
  # === Fetch User Profile ===
  - id: fetch_user
    module: api.http.get
    description: "Fetch user profile from API"
    params:
      url: "https://jsonplaceholder.typicode.com/users/${params.user_id}"
      headers:
        Accept: "application/json"
    timeout_ms: 5000
    retry:
      max_attempts: 3
      delay_ms: 1000
      backoff: "exponential"

  # === Fetch User's Posts ===
  - id: fetch_posts
    module: api.http.get
    description: "Fetch user's posts"
    params:
      url: "https://jsonplaceholder.typicode.com/posts?userId=${params.user_id}"
      headers:
        Accept: "application/json"
    timeout_ms: 5000

  # === Fetch User's Todos ===
  - id: fetch_todos
    module: api.http.get
    description: "Fetch user's todos"
    params:
      url: "https://jsonplaceholder.typicode.com/todos?userId=${params.user_id}"
      headers:
        Accept: "application/json"
    timeout_ms: 5000

  # === Send Combined Data to Webhook ===
  - id: send_webhook
    module: api.http.post
    description: "Send aggregated data to webhook"
    params:
      url: "${params.webhook_url}"
      headers:
        Content-Type: "application/json"
      body:
        user: "${fetch_user.data}"
        posts_count: "${fetch_posts.data.length}"
        todos_count: "${fetch_todos.data.length}"
        completed_todos: "${fetch_todos.data.filter(t => t.completed).length}"
        timestamp: "${timestamp}"

# Output
output:
  user_id: "${params.user_id}"
  user_name: "${fetch_user.data.name}"
  user_email: "${fetch_user.data.email}"
  posts_count: "${fetch_posts.data.length}"
  todos_count: "${fetch_todos.data.length}"
  webhook_sent: true
  timestamp: "${timestamp}"