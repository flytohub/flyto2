name: "Browser Screenshot Capture"
description: "Capture screenshots of websites automatically"
version: "1.0.0"

params:
  url:
    type: string
    description: "Website URL to capture"
    default: "https://github.com/flytohub/flyto2"

steps:
  - id: launch_browser
    module: core.browser.launch
    params:
      headless: true
      viewport:
        width: 1920
        height: 1080

  - id: navigate
    module: core.browser.goto
    params:
      browser: "${launch_browser.browser}"
      url: "${params.url}"
      wait_until: "networkidle"

  - id: wait_for_load
    module: utility.delay
    params:
      seconds: 2

  - id: capture_screenshot
    module: core.browser.screenshot
    params:
      browser: "${launch_browser.browser}"
      path: "screenshot_${utility.datetime.now}.png"
      full_page: true

output:
  screenshot_path: "${capture_screenshot.path}"
  url_captured: "${params.url}"
  timestamp: "${utility.datetime.now}"
