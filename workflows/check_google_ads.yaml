id: check_google_ads
name: Check Website for Google Ads
version: "1.0.0"
description: Check if a website contains Google AdSense ads

params:
  - name: url
    type: string
    required: true
    description: Website URL to check

steps:
  - id: launch
    module: core.browser.launch
    params:
      headless: true
      browser_type: chromium

  - id: goto
    module: core.browser.goto
    params:
      url: ${params.url}
      wait_until: networkidle

  - id: wait_for_load
    module: core.browser.wait
    params:
      type: timeout
      timeout: 2000

  - id: extract_scripts
    module: core.browser.extract
    params:
      selector: "script"
      limit: 100
      fields:
        src:
          selector: "script"
          type: attribute
          attribute: src

  - id: extract_iframes
    module: core.browser.extract
    params:
      selector: "iframe"
      limit: 50
      fields:
        src:
          selector: "iframe"
          type: attribute
          attribute: src

  - id: take_screenshot
    module: core.browser.screenshot
    params:
      path: screenshots/google_ads_check.png
      full_page: false

output:
  url: ${params.url}
  has_google_ads: >
    ${extract_scripts.data}
  google_ad_scripts: []
  google_ad_iframes: []
  screenshot: screenshots/google_ads_check.png
  checked_at: ${workflow.timestamp}
