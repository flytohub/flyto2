# Daily Report Generator → Email
# Generate daily metrics report and send via email

id: daily-report-email
name: "Daily Metrics Report → Email"
version: "1.0.0"
description: "Fetch daily metrics from API and send formatted email report"
author: "Flyto2 Team"
tags: ["email", "report", "automation", "api", "daily"]

# User parameters
params:
  - name: report_date
    type: string
    label: "Report Date"
    description: "Date for report (YYYY-MM-DD), leave empty for today"
    required: false

  - name: recipient_email
    type: string
    label: "Recipient Email"
    description: "Who receives the report"
    required: true
    placeholder: "manager@company.com"

# Workflow steps
steps:
  # === Get Current Date ===
  - id: get_date
    module: utility.datetime.now
    description: "Get current date"
    params:
      format: "date"

  # === Fetch Metrics from API ===
  - id: fetch_metrics
    module: api.http.get
    description: "Fetch daily metrics"
    params:
      url: "https://api.example.com/metrics/daily"
      headers:
        Authorization: "Bearer ${env.API_TOKEN}"
      params:
        date: "${params.report_date}"
      timeout: 30

  # === Parse JSON Response ===
  - id: parse_data
    module: data.json.parse
    description: "Parse metrics data"
    params:
      json_string: "${fetch_metrics.body}"

  # === Generate HTML Report ===
  - id: format_html
    module: data.text.template
    description: "Format HTML email"
    params:
      template: |
        <html>
        <head>
          <style>
            body {{ font-family: Arial, sans-serif; }}
            h1 {{ color: #2563EB; }}
            table {{ border-collapse: collapse; width: 100%; }}
            th, td {{ border: 1px solid #ddd; padding: 8px; text-align: left; }}
            th {{ background-color: #f3f4f6; }}
            .metric {{ font-size: 24px; font-weight: bold; color: #059669; }}
          </style>
        </head>
        <body>
          <h1>📊 Daily Report - {date}</h1>

          <h2>Key Metrics</h2>
          <table>
            <tr>
              <th>Metric</th>
              <th>Value</th>
            </tr>
            <tr>
              <td>Total Users</td>
              <td class="metric">{total_users}</td>
            </tr>
            <tr>
              <td>New Signups</td>
              <td class="metric">{new_signups}</td>
            </tr>
            <tr>
              <td>Revenue</td>
              <td class="metric">${revenue}</td>
            </tr>
          </table>

          <p><em>Generated by Flyto2 Automation</em></p>
        </body>
        </html>
      variables:
        date: "${get_date.datetime}"
        total_users: "1,234"
        new_signups: "45"
        revenue: "5,678"

  # === Send Email ===
  - id: send_email
    module: notification.email.send
    description: "Send report via email"
    params:
      smtp_server: "${env.SMTP_SERVER}"
      smtp_port: 587
      username: "${env.SMTP_USERNAME}"
      password: "${env.SMTP_PASSWORD}"
      from_email: "${env.SMTP_USERNAME}"
      to_email: "${params.recipient_email}"
      subject: "Daily Report - ${get_date.datetime}"
      body: "${format_html.result}"
      html: true

  # === Wait Before Notification ===
  - id: delay
    module: utility.delay
    description: "Wait 1 second"
    params:
      duration_seconds: 1

  # === Send Backup Notification to Slack ===
  - id: notify_slack
    module: notification.slack.send_message
    description: "Send confirmation to Slack"
    params:
      webhook_url: "${env.SLACK_WEBHOOK_URL}"
      text: "✅ Daily report sent to ${params.recipient_email}"
      channel: "#reports"
    on_error: "continue"

# Output
output:
  report_date: "${get_date.datetime}"
  email_sent: "${send_email.sent}"
  recipient: "${params.recipient_email}"
  slack_notified: "${notify_slack.sent}"

# Environment variables needed:
# - API_TOKEN: API authentication token
# - SMTP_SERVER: SMTP server hostname
# - SMTP_USERNAME: SMTP username
# - SMTP_PASSWORD: SMTP password
# - SLACK_WEBHOOK_URL: Slack webhook (optional)
