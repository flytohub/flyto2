# GitHub Issues Monitor → Slack Notification
# Real-world use case: Monitor GitHub issues and send alerts to Slack

id: github-to-slack-monitor
name: "GitHub Issues → Slack Alert"
version: "1.0.0"
description: "Monitor GitHub repository issues and send new issues to Slack"
author: "Flyto2 Team"
tags: ["github", "slack", "notification", "automation", "integration"]

# User parameters
params:
  - name: repo_owner
    type: string
    label: "Repository Owner"
    description: "GitHub repository owner (username or organization)"
    required: true
    placeholder: "facebook"

  - name: repo_name
    type: string
    label: "Repository Name"
    description: "GitHub repository name"
    required: true
    placeholder: "react"

  - name: issue_labels
    type: string
    label: "Filter by Labels"
    description: "Only monitor issues with these labels (comma-separated)"
    required: false
    placeholder: "bug,critical"

# Workflow steps
steps:
  # === Fetch Open Issues from GitHub ===
  - id: fetch_issues
    module: api.github.list_issues
    description: "Get open issues from GitHub"
    params:
      owner: "${params.repo_owner}"
      repo: "${params.repo_name}"
      state: "open"
      labels: "${params.issue_labels}"
      limit: 10
      token: "${env.GITHUB_TOKEN}"

  # === Format Issue Summary ===
  - id: format_message
    module: data.text.template
    description: "Format Slack message"
    params:
      template: |
        📊 *GitHub Issues Report*
        Repository: {repo}
        Open Issues: {count}
        Labels: {labels}

        Latest Issues:
        {issues_list}
      variables:
        repo: "${params.repo_owner}/${params.repo_name}"
        count: "${fetch_issues.count}"
        labels: "${params.issue_labels}"
        issues_list: "Check issues above"

  # === Send to Slack ===
  - id: send_slack
    module: notification.slack.send_message
    description: "Send notification to Slack"
    params:
      webhook_url: "${env.SLACK_WEBHOOK_URL}"
      text: "${format_message.result}"
      channel: "#github-alerts"
      username: "GitHub Bot"
      icon_emoji: ":octocat:"

# Output
output:
  repo: "${params.repo_owner}/${params.repo_name}"
  issues_found: "${fetch_issues.count}"
  slack_sent: "${send_slack.sent}"
  timestamp: "${timestamp}"

# Environment variables needed:
# - GITHUB_TOKEN: GitHub Personal Access Token
# - SLACK_WEBHOOK_URL: Slack webhook URL
