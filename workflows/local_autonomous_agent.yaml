name: "Local Autonomous AI Agent"
description: "Autonomous AI agent running completely offline with local LLM"

# Requirements:
# 1. Install Ollama: https://ollama.ai
# 2. Pull a model: ollama pull mistral (recommended for reasoning tasks)
# 3. Start Ollama: ollama serve
# 4. Run: python -m src.cli.main workflows/local_autonomous_agent.yaml

steps:
  - id: local_agent
    module: agent.autonomous
    params:
      # Choose local provider instead of OpenAI
      llm_provider: "ollama"
      model: "mistral"
      ollama_url: "http://localhost:11434"

      # Agent goal
      goal: "Research and explain the key differences between microservices and monolithic architecture. Provide 3 main points."

      # Optional context
      context: "Focus on practical implications for development teams"

      # Agent reasoning parameters
      max_iterations: 5
      temperature: 0.7

  - id: save_report
    module: data.file.write
    params:
      file_path: "agent_report_${timestamp}.txt"
      content: |
        Local AI Agent Report
        =====================

        Goal: ${local_agent.goal}
        Model: ${local_agent.model}
        Provider: Local Ollama (Offline)

        Result:
        ${local_agent.result}

        Reasoning Steps (${local_agent.iterations} iterations):
        ${local_agent.thoughts}

        Goal Achieved: ${local_agent.goal_achieved}

# This workflow demonstrates:
# - Completely offline AI agent execution
# - No API keys required
# - Full data privacy (nothing sent to cloud)
# - Local LLM reasoning capabilities
