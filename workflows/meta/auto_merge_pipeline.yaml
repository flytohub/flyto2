name: "Auto-Merge Pipeline"
description: "Automatically merge AI modifications that pass quality gates"
category: "meta"

params:
  module_id:
    type: string
    description: "Module to merge (e.g., string.split)"
    required: true

  proposed_changes_file:
    type: string
    description: "File containing AI's proposed code changes"
    required: true

  gate_results_file:
    type: string
    description: "Quality gate test results file"
    required: true

  deployed_by:
    type: string
    description: "Who deployed (ai_agent or human)"
    default: "ai_agent"

  dry_run:
    type: boolean
    description: "If true, only simulate (don't actually merge)"
    default: false

steps:
  # Step 1: Load and parse quality gate results
  - id: load_gate_results
    module: file.read
    params:
      file_path: "{{ params.gate_results_file }}"

  - id: parse_gate_results
    module: data.json.parse
    params:
      json_string: "{{ steps.load_gate_results.output }}"

  # Step 2: Safety validation (kill switch, blacklist, rate limits)
  - id: safety_check
    module: bash.execute
    params:
      command: |
        python scripts/safety_manager.py validate \
          --module "{{ params.module_id }}" \
          --pass-rate {{ steps.parse_gate_results.output.new_pass_rate }} \
          --test-runs {{ steps.parse_gate_results.output.test_runs }}
    continue_on_error: true

  - id: parse_safety_result
    module: data.json.parse
    params:
      json_string: "{{ steps.safety_check.output.stdout }}"

  - id: check_safety_approved
    module: test.assert_true
    params:
      value: "{{ steps.parse_safety_result.output.allowed }}"
      message: "Safety check failed: {{ steps.parse_safety_result.output.reason }}"
    when: "{{ not params.dry_run }}"

  - id: check_gate_passed
    module: test.assert_equal
    params:
      actual: "{{ steps.parse_gate_results.output.gate_decision }}"
      expected: "PASS"
      message: "Quality gate must pass before auto-merge"

  - id: check_pass_rate
    module: test.assert_true
    params:
      value: "{{ steps.parse_gate_results.output.new_pass_rate >= 0.98 }}"
      message: "Pass rate must be >= 98% for auto-merge"

  - id: check_category_atomic
    module: test.assert_equal
    params:
      actual: "{{ steps.parse_gate_results.output.module_category }}"
      expected: "atomic"
      message: "Only atomic modules can be auto-merged"

  # Step 2: Get module file path from gate results
  - id: get_module_file
    module: bash.execute
    params:
      command: |
        python -c "
        import json
        import sys
        from src.core.modules.registry import ModuleRegistry

        module_id = sys.argv[1]
        metadata = ModuleRegistry.get_metadata(module_id)

        # Get file path from module's __module__ attribute
        module_class = ModuleRegistry.get(module_id)
        import inspect
        file_path = inspect.getfile(module_class)

        print(json.dumps({'file_path': file_path}))
        " "{{ params.module_id }}"

  - id: parse_file_path
    module: data.json.parse
    params:
      json_string: "{{ steps.get_module_file.output.stdout }}"

  # Step 3: Create snapshot backup before deployment
  - id: create_snapshot
    module: bash.execute
    params:
      command: |
        python scripts/deployment_manager.py record \
          "{{ params.module_id }}" \
          "{{ steps.parse_file_path.output.file_path }}" \
          "{{ params.deployed_by }}" \
          "{{ steps.parse_gate_results.output.baseline_pass_rate }}"
      timeout: 30000

  - id: parse_snapshot
    module: data.json.parse
    params:
      json_string: "{{ steps.create_snapshot.output.stdout }}"

  # Step 4: Apply proposed changes
  - id: read_proposed_changes
    module: file.read
    params:
      file_path: "{{ params.proposed_changes_file }}"

  - id: write_new_code
    module: file.write
    params:
      file_path: "{{ steps.parse_file_path.output.file_path }}"
      content: "{{ steps.read_proposed_changes.output }}"

  # Step 5: Run final verification tests
  - id: verify_tests
    module: bash.execute
    params:
      command: |
        # Run quality tests for this specific module
        ./scripts/run_quality_tests.sh {{ params.module_id }}
      timeout: 300000

  - id: check_verification_passed
    module: test.assert_equal
    params:
      actual: "{{ steps.verify_tests.output.exit_code }}"
      expected: 0
      message: "Final verification tests must pass"

  # Step 6: Git commit (skip in dry-run mode)
  - id: git_add
    module: bash.execute
    params:
      command: git add "{{ steps.parse_file_path.output.file_path }}"
    when: "{{ not params.dry_run }}"

  - id: git_commit
    module: bash.execute
    params:
      command: |
        git commit -m "$(cat <<'EOF'
        auto: Improve {{ params.module_id }} quality

        Pass rate: {{ steps.parse_gate_results.output.baseline_pass_rate }} → {{ steps.parse_gate_results.output.new_pass_rate }}
        Tests: {{ steps.parse_gate_results.output.test_runs }} runs
        Gate: PASS (auto-merged)

        Changes automatically merged after passing 98% quality gate.
        Snapshot: {{ steps.parse_snapshot.output.version }}_{{ steps.parse_snapshot.output.commit }}
        EOF
        )"
    when: "{{ not params.dry_run }}"

  # Step 7: Record action for rate limiting
  - id: record_rate_limit
    module: bash.execute
    params:
      command: |
        python -c "
        from scripts.safety_manager import SafetyManager
        manager = SafetyManager()
        manager.record_action('auto_merge', '{{ params.module_id }}', {
          'pass_rate': {{ steps.parse_gate_results.output.new_pass_rate }},
          'deployed_by': '{{ params.deployed_by }}',
          'dry_run': {{ params.dry_run | lower }}
        })
        print('Recorded auto-merge action')
        "
    when: "{{ not params.dry_run }}"

  # Step 8: Update deployment history with post-deploy status
  - id: update_deployment
    module: bash.execute
    params:
      command: |
        python -c "
        from scripts.deployment_manager import DeploymentManager
        manager = DeploymentManager()
        manager.update_post_deploy_pass_rate('{{ params.module_id }}', {{ steps.parse_gate_results.output.new_pass_rate }})
        print('Updated post-deploy pass rate')
        "
    when: "{{ not params.dry_run }}"

  # Step 9: Send success notification
  - id: notify_success
    module: telegram.send_message
    params:
      chat_id: "{{ env.TELEGRAM_CHAT_ID }}"
      message: |
        {% if params.dry_run %}
        🔍 DRY-RUN: Auto-Merge Simulation

        **Module**: `{{ params.module_id }}`
        **Quality**: {{ steps.parse_gate_results.output.baseline_pass_rate }} → {{ steps.parse_gate_results.output.new_pass_rate }}
        **Status**: Would have been auto-merged (dry-run mode)
        **Safety check**: {{ steps.parse_safety_result.output.reason }}

        ℹ️ No changes were actually committed (dry-run mode).
        {% else %}
        ✅ Auto-Merge Successful

        **Module**: `{{ params.module_id }}`
        **Quality**: {{ steps.parse_gate_results.output.baseline_pass_rate }} → {{ steps.parse_gate_results.output.new_pass_rate }}
        **Version**: {{ steps.parse_snapshot.output.version }}
        **Commit**: {{ steps.parse_snapshot.output.commit }}
        **Deployed by**: {{ params.deployed_by }}
        **Time**: {{ steps.parse_snapshot.output.deployed_at }}

        ⏱ Monitoring for 24h before marking stable.
        🔄 Rollback available if quality degrades.
        {% endif %}

output:
  deployment_record: "{{ steps.parse_snapshot.output }}"
  git_commit: "{{ steps.git_commit.output.stdout }}"
  verification_passed: true
  notification_sent: true
