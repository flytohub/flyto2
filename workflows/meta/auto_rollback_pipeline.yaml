name: "Auto-Rollback Pipeline"
description: "Automatically rollback modules that degrade in production"
category: "meta"

params:
  module_id:
    type: string
    description: "Module to check and potentially rollback"
    required: true

  monitoring_window_hours:
    type: integer
    description: "Hours to monitor after deployment (default: 24)"
    default: 24

  force_check:
    type: boolean
    description: "Force check even if outside monitoring window"
    default: false

steps:
  # Step 1: Get current deployment info
  - id: get_deployment
    module: bash.execute
    params:
      command: python scripts/deployment_manager.py info "{{ params.module_id }}"

  - id: parse_deployment
    module: data.json.parse
    params:
      json_string: "{{ steps.get_deployment.output.stdout }}"

  - id: check_deployment_exists
    module: test.assert_true
    params:
      value: "{{ steps.parse_deployment.output != null }}"
      message: "No deployment found for {{ params.module_id }}"

  # Step 2: Check if within monitoring window
  - id: check_monitoring_window
    module: bash.execute
    params:
      command: |
        python -c "
        from datetime import datetime, timezone
        import json
        import sys

        deployed_at = '{{ steps.parse_deployment.output.latest_deployment.deployed_at }}'
        window_hours = {{ params.monitoring_window_hours }}

        deployed_time = datetime.fromisoformat(deployed_at.replace('Z', '+00:00'))
        now = datetime.now(timezone.utc)
        hours_since = (now - deployed_time).total_seconds() / 3600

        result = {
          'hours_since_deployment': hours_since,
          'within_window': hours_since <= window_hours,
          'deployed_at': deployed_at
        }
        print(json.dumps(result))
        "

  - id: parse_window_check
    module: data.json.parse
    params:
      json_string: "{{ steps.check_monitoring_window.output.stdout }}"

  - id: verify_within_window
    module: test.assert_true
    params:
      value: "{{ steps.parse_window_check.output.within_window or params.force_check }}"
      message: "Module {{ params.module_id }} outside monitoring window ({{ steps.parse_window_check.output.hours_since_deployment }}h since deployment)"
      skip_on_fail: true

  # Step 3: Run current quality tests
  - id: run_tests
    module: bash.execute
    params:
      command: |
        # Create temp results file
        RESULTS_FILE="metrics/test_results_rollback_check_$(date +%Y%m%d_%H%M%S).txt"

        # Run tests
        echo "Testing {{ params.module_id }}..."
        RUNS=10
        SUCCESS=0
        FAIL=0

        for i in $(seq 1 $RUNS); do
          TEST_FILE="workflows/_test/test_$(echo {{ params.module_id }} | tr '.' '_').yaml"

          if [ -f "$TEST_FILE" ]; then
            if python -m src.cli.main "$TEST_FILE" > /dev/null 2>&1; then
              SUCCESS=$((SUCCESS + 1))
            else
              FAIL=$((FAIL + 1))
            fi
          else
            echo "ERROR: Test file not found: $TEST_FILE"
            exit 1
          fi
        done

        PASS_RATE=$(echo "scale=3; $SUCCESS / $RUNS" | bc)

        # Save results
        echo "{{ params.module_id }},$SUCCESS,$FAIL,$PASS_RATE" > "$RESULTS_FILE"

        # Output results as JSON
        python -c "
        import json
        print(json.dumps({
          'success': $SUCCESS,
          'fail': $FAIL,
          'pass_rate': float('$PASS_RATE'),
          'results_file': '$RESULTS_FILE'
        }))
        "
      timeout: 300000

  - id: parse_test_results
    module: data.json.parse
    params:
      json_string: "{{ steps.run_tests.output.stdout }}"

  # Step 4: Decide if rollback is needed
  - id: analyze_degradation
    module: bash.execute
    params:
      command: |
        python -c "
        import json

        current_pass_rate = {{ steps.parse_test_results.output.pass_rate }}
        pre_deploy_pass_rate = {{ steps.parse_deployment.output.latest_deployment.pre_deploy_pass_rate }}
        failures = {{ steps.parse_test_results.output.fail }}

        # Rollback criteria:
        # 1. Current pass rate < 0.98 (below threshold)
        # 2. Current pass rate < pre-deploy (regression)
        # 3. More than 2 failures in 10 runs

        rollback_needed = False
        reasons = []

        if current_pass_rate < 0.98:
          rollback_needed = True
          reasons.append(f'Pass rate {current_pass_rate} below 98% threshold')

        if current_pass_rate < pre_deploy_pass_rate:
          rollback_needed = True
          reasons.append(f'Regression: {pre_deploy_pass_rate} → {current_pass_rate}')

        if failures > 2:
          rollback_needed = True
          reasons.append(f'{failures} failures in 10 runs (max: 2)')

        result = {
          'rollback_needed': rollback_needed,
          'current_pass_rate': current_pass_rate,
          'pre_deploy_pass_rate': pre_deploy_pass_rate,
          'failures': failures,
          'reasons': reasons,
          'reason': '; '.join(reasons) if reasons else 'No issues detected'
        }

        print(json.dumps(result))
        "

  - id: parse_degradation
    module: data.json.parse
    params:
      json_string: "{{ steps.analyze_degradation.output.stdout }}"

  # Step 5: If rollback needed, execute it
  - id: execute_rollback
    module: bash.execute
    params:
      command: |
        python scripts/deployment_manager.py rollback \
          "{{ params.module_id }}" \
          "{{ steps.parse_degradation.output.reason }}" \
          {{ steps.parse_test_results.output.pass_rate }}
    when: "{{ steps.parse_degradation.output.rollback_needed }}"

  - id: parse_rollback_result
    module: data.json.parse
    params:
      json_string: "{{ steps.execute_rollback.output.stdout }}"
    when: "{{ steps.parse_degradation.output.rollback_needed }}"

  # Step 6: Git commit the rollback
  - id: get_module_file_path
    module: bash.execute
    params:
      command: |
        python -c "
        from src.core.modules.registry import ModuleRegistry
        import inspect
        module_class = ModuleRegistry.get('{{ params.module_id }}')
        print(inspect.getfile(module_class))
        "
    when: "{{ steps.parse_degradation.output.rollback_needed }}"

  - id: git_add_rollback
    module: bash.execute
    params:
      command: git add "{{ steps.get_module_file_path.output.stdout | trim }}"
    when: "{{ steps.parse_degradation.output.rollback_needed }}"

  - id: git_commit_rollback
    module: bash.execute
    params:
      command: |
        git commit -m "$(cat <<'EOF'
        auto-rollback: Revert {{ params.module_id }} to {{ steps.parse_rollback_result.output.to_version }}

        Reason: {{ steps.parse_degradation.output.reason }}
        Current pass rate: {{ steps.parse_test_results.output.pass_rate }}
        Expected: >= {{ steps.parse_deployment.output.latest_deployment.pre_deploy_pass_rate }}

        Rolled back from {{ steps.parse_rollback_result.output.from_version }} due to quality degradation.
        Automatic rollback by monitoring agent.
        EOF
        )"
    when: "{{ steps.parse_degradation.output.rollback_needed }}"

  # Step 7: Send alert
  - id: alert_rollback
    module: telegram.send_message
    params:
      chat_id: "{{ env.TELEGRAM_CHAT_ID }}"
      message: |
        ⚠️ **AUTO-ROLLBACK EXECUTED**

        **Module**: `{{ params.module_id }}`
        **Rolled back**: {{ steps.parse_rollback_result.output.from_version }} → {{ steps.parse_rollback_result.output.to_version }}

        **Quality Degradation**:
        {{ steps.parse_degradation.output.reason }}

        **Metrics**:
        • Current: {{ steps.parse_test_results.output.pass_rate }}
        • Expected: ≥ {{ steps.parse_deployment.output.latest_deployment.pre_deploy_pass_rate }}
        • Failures: {{ steps.parse_test_results.output.fail }}/10 runs

        🔍 **Requires manual investigation**
        📊 Deployment history updated
    when: "{{ steps.parse_degradation.output.rollback_needed }}"

  # Step 8: Send all-clear if no rollback needed
  - id: notify_all_clear
    module: telegram.send_message
    params:
      chat_id: "{{ env.TELEGRAM_CHAT_ID }}"
      message: |
        ✅ **Quality Check Passed**

        **Module**: `{{ params.module_id }}`
        **Pass rate**: {{ steps.parse_test_results.output.pass_rate }}
        **Status**: Stable
        **Hours since deploy**: {{ steps.parse_window_check.output.hours_since_deployment }}

        No rollback needed.
    when: "{{ not steps.parse_degradation.output.rollback_needed }}"

output:
  rollback_executed: "{{ steps.parse_degradation.output.rollback_needed }}"
  current_pass_rate: "{{ steps.parse_test_results.output.pass_rate }}"
  pre_deploy_pass_rate: "{{ steps.parse_deployment.output.latest_deployment.pre_deploy_pass_rate }}"
  degradation_reason: "{{ steps.parse_degradation.output.reason }}"
  rollback_details: "{{ steps.parse_rollback_result.output if steps.parse_degradation.output.rollback_needed else null }}"
