name: "Continuous Improvement AI Agent"
description: "AI agent that autonomously improves module quality"
category: "meta"

schedule:
  cron: "0 2 * * *"  # Daily at 2 AM (low traffic time)

params:
  max_improvements:
    type: integer
    description: "Maximum number of improvements to attempt per run"
    default: 3

  dry_run:
    type: boolean
    description: "Analyze only, don't actually merge changes"
    default: false

steps:
  # Step 1: Load quality metrics
  - id: load_quality_metrics
    module: file.read
    params:
      file_path: "metrics/module_quality.json"

  - id: parse_metrics
    module: data.json.parse
    params:
      json_string: "{{ steps.load_quality_metrics.output }}"

  # Step 2: Analyze and identify improvement opportunities
  - id: analyze_opportunities
    module: ai.openai.chat
    params:
      model: "gpt-4"
      temperature: 0.3
      system_message: |
        You are a continuous improvement AI agent for a workflow automation system.

        Your task: Analyze module quality metrics and identify improvement opportunities.

        **Criteria for identifying issues:**
        1. Pass rate 95-98% (needs improvement to reach auto-merge threshold)
        2. quality_trend = "needs_attention" or "degrading"
        3. Recent failures (fail_runs > 0)
        4. Error patterns in error_types field

        **For each opportunity, provide:**
        - module_id
        - category (must be "atomic" - never modify third_party or composed)
        - current_pass_rate
        - issue_type (e.g., "below_threshold", "degrading", "frequent_failures")
        - root_cause_hypothesis (educated guess based on error patterns)
        - priority_score (0-100, higher = more urgent)
        - improvement_approach (brief description of how to fix)

        **Priority scoring:**
        - 90-100: Critical (pass rate < 0.95)
        - 70-89: High (pass rate 0.95-0.96)
        - 50-69: Medium (pass rate 0.96-0.98)
        - 0-49: Low (pass rate > 0.98 but trending down)

        Return a JSON array of opportunities, sorted by priority_score descending.

      user_message: |
        Analyze these module quality metrics:

        ```json
        {{ steps.parse_metrics.output | tojson }}
        ```

        Identify improvement opportunities for atomic modules only.

  - id: parse_opportunities
    module: data.json.parse
    params:
      json_string: "{{ steps.analyze_opportunities.output.content }}"

  # Step 3: Filter atomic modules only (safety check)
  - id: filter_atomic_only
    module: bash.execute
    params:
      command: |
        python -c "
        import json
        import sys

        opportunities = {{ steps.parse_opportunities.output | tojson }}

        # Filter: only atomic category
        atomic_only = [
          opp for opp in opportunities
          if opp.get('category') == 'atomic'
        ]

        print(json.dumps(atomic_only))
        "

  - id: parse_atomic_opportunities
    module: data.json.parse
    params:
      json_string: "{{ steps.filter_atomic_only.output.stdout }}"

  # Step 4: Select top N opportunities
  - id: select_top_opportunities
    module: bash.execute
    params:
      command: |
        python -c "
        import json

        opportunities = {{ steps.parse_atomic_opportunities.output | tojson }}
        max_improvements = {{ params.max_improvements }}

        # Take top N by priority_score
        top_opportunities = sorted(
          opportunities,
          key=lambda x: x.get('priority_score', 0),
          reverse=True
        )[:max_improvements]

        print(json.dumps(top_opportunities))
        "

  - id: parse_selected
    module: data.json.parse
    params:
      json_string: "{{ steps.select_top_opportunities.output.stdout }}"

  # Step 5: For each opportunity, propose code improvements
  - id: propose_code_changes
    module: ai.openai.chat
    params:
      model: "gpt-4"
      temperature: 0.2
      system_message: |
        You are improving module: {{ item.module_id }}

        **Current Issue:**
        - Issue type: {{ item.issue_type }}
        - Root cause: {{ item.root_cause_hypothesis }}
        - Pass rate: {{ item.current_pass_rate }}
        - Priority: {{ item.priority_score }}/100

        **Your Task:**
        1. Read and understand the current module code
        2. Identify the specific code that causes the issue
        3. Propose improved code that:
           - Fixes the identified issue
           - Maintains backward compatibility
           - Follows atomic module rules (no external API calls)
           - Improves reliability and edge case handling
           - Adds better error handling if needed

        **Atomic Module Rules:**
        - MUST NOT import: requests, httpx, aiohttp, openai, anthropic, playwright, psycopg2, pymongo
        - CAN import: standard library (json, re, datetime, etc.), yaml, pydantic
        - Must be pure, deterministic operations when possible

        **Return JSON:**
        {
          "module_id": "{{ item.module_id }}",
          "proposed_code": "complete new module code",
          "changes_summary": "brief description of changes",
          "risk_assessment": "low/medium/high",
          "expected_improvement": "why this will improve quality"
        }

      user_message: |
        Current module code:

        ```python
        {{ read_module_code(item.module_id) }}
        ```

        Propose improvements to fix: {{ item.root_cause_hypothesis }}

    for_each: "{{ steps.parse_selected.output }}"
    continue_on_error: true

  # Step 6: Save proposed changes to files
  - id: save_proposed_changes
    module: bash.execute
    params:
      command: |
        python -c "
        import json
        import os
        from datetime import datetime

        proposals = {{ steps.propose_code_changes.output | tojson }}
        timestamp = datetime.utcnow().strftime('%Y%m%d_%H%M%S')

        # Create proposals directory
        proposals_dir = f'metrics/proposals/{timestamp}'
        os.makedirs(proposals_dir, exist_ok=True)

        saved_files = []

        for i, proposal in enumerate(proposals):
          if not isinstance(proposal, dict):
            continue

          module_id = proposal.get('module_id', f'unknown_{i}')
          filename = f'{module_id.replace(\".\", \"_\")}_proposal.py'
          filepath = os.path.join(proposals_dir, filename)

          # Save proposed code
          with open(filepath, 'w') as f:
            f.write(proposal.get('proposed_code', ''))

          # Save metadata
          meta_filepath = os.path.join(proposals_dir, f'{module_id.replace(\".\", \"_\")}_metadata.json')
          with open(meta_filepath, 'w') as f:
            json.dump({
              'module_id': module_id,
              'changes_summary': proposal.get('changes_summary'),
              'risk_assessment': proposal.get('risk_assessment'),
              'expected_improvement': proposal.get('expected_improvement'),
              'proposal_time': timestamp
            }, f, indent=2)

          saved_files.append({
            'module_id': module_id,
            'code_file': filepath,
            'metadata_file': meta_filepath
          })

        print(json.dumps({'proposals_dir': proposals_dir, 'files': saved_files}))
        "

  - id: parse_saved_proposals
    module: data.json.parse
    params:
      json_string: "{{ steps.save_proposed_changes.output.stdout }}"

  # Step 7: Test each proposal through quality gate
  - id: test_proposals
    module: workflow.execute
    params:
      workflow_path: "workflows/meta/module_quality_pipeline.yaml"
      params:
        module_id: "{{ item.module_id }}"
        proposed_changes_file: "{{ item.code_file }}"
        baseline_version: "current"
    for_each: "{{ steps.parse_saved_proposals.output.files }}"
    continue_on_error: true

  # Step 8: Auto-merge proposals that passed gate (if not dry_run)
  - id: auto_merge_passed
    module: workflow.execute
    params:
      workflow_path: "workflows/meta/auto_merge_pipeline.yaml"
      params:
        module_id: "{{ item.module_id }}"
        proposed_changes_file: "{{ item.code_file }}"
        gate_results_file: "{{ item.gate_results_file }}"
        deployed_by: "ai_agent"
    for_each: "{{ steps.test_proposals.output }}"
    when: "{{ item.gate_decision == 'PASS' and not params.dry_run }}"
    continue_on_error: true

  # Step 9: Generate improvement report
  - id: generate_report
    module: bash.execute
    params:
      command: |
        python -c "
        import json
        from datetime import datetime

        opportunities = {{ steps.parse_selected.output | tojson }}
        test_results = {{ steps.test_proposals.output | tojson }}
        merge_results = {{ steps.auto_merge_passed.output | tojson }}
        dry_run = {{ params.dry_run | tojson }}

        # Count results
        total_analyzed = len(opportunities)
        total_proposed = len(test_results) if isinstance(test_results, list) else 0

        passed_gate = sum(
          1 for result in test_results
          if isinstance(result, dict) and result.get('gate_decision') == 'PASS'
        ) if isinstance(test_results, list) else 0

        auto_merged = sum(
          1 for result in merge_results
          if isinstance(result, dict) and result.get('success', False)
        ) if isinstance(merge_results, list) and not dry_run else 0

        failed_gate = total_proposed - passed_gate

        # Get details of each category
        passed_modules = [
          result.get('module_id')
          for result in test_results
          if isinstance(result, dict) and result.get('gate_decision') == 'PASS'
        ] if isinstance(test_results, list) else []

        failed_modules = [
          {
            'module_id': result.get('module_id'),
            'reason': result.get('reject_reason', 'Unknown')
          }
          for result in test_results
          if isinstance(result, dict) and result.get('gate_decision') == 'REJECT'
        ] if isinstance(test_results, list) else []

        report = {
          'timestamp': datetime.utcnow().isoformat() + 'Z',
          'dry_run': dry_run,
          'analysis': {
            'opportunities_identified': total_analyzed,
            'proposals_generated': total_proposed
          },
          'testing': {
            'passed_quality_gate': passed_gate,
            'failed_quality_gate': failed_gate,
            'pass_rate': (passed_gate / total_proposed * 100) if total_proposed > 0 else 0
          },
          'deployment': {
            'auto_merged': auto_merged,
            'pending_review': passed_gate - auto_merged if not dry_run else passed_gate
          },
          'modules': {
            'passed': passed_modules,
            'failed': failed_modules
          },
          'summary': f'Analyzed {total_analyzed} opportunities, generated {total_proposed} proposals, {passed_gate} passed gate, {auto_merged} auto-merged' if not dry_run else f'DRY RUN: Analyzed {total_analyzed} opportunities, {passed_gate}/{total_proposed} would pass gate'
        }

        print(json.dumps(report, indent=2))
        "

  - id: parse_report
    module: data.json.parse
    params:
      json_string: "{{ steps.generate_report.output.stdout }}"

  # Step 10: Send daily report to Telegram
  - id: format_telegram_message
    module: bash.execute
    params:
      command: |
        python -c "
        import json
        report = {{ steps.parse_report.output | tojson }}

        dry_run_note = '**DRY RUN MODE** - No changes deployed\n\n' if report['dry_run'] else ''

        msg = f'''
        🤖 **Continuous Improvement Daily Report**

        {dry_run_note}**Analysis**:
        • Opportunities identified: {report['analysis']['opportunities_identified']}
        • Proposals generated: {report['analysis']['proposals_generated']}

        **Quality Gate Testing**:
        • Passed: {report['testing']['passed_quality_gate']} ✅
        • Failed: {report['testing']['failed_quality_gate']} ❌
        • Success rate: {report['testing']['pass_rate']:.1f}%

        **Deployment**:
        • Auto-merged: {report['deployment']['auto_merged']} 🚀
        • Pending review: {report['deployment']['pending_review']} ⏳
        '''

        if report['modules']['passed']:
          msg += '\n**Passed Modules**:\n'
          for module_id in report['modules']['passed']:
            msg += f'  • `{module_id}`\n'

        if report['modules']['failed']:
          msg += '\n**Failed Gate**:\n'
          for failure in report['modules']['failed']:
            msg += f'  • `{failure[\"module_id\"]}`: {failure[\"reason\"]}\n'

        msg += f'\n_Time: {report[\"timestamp\"]}_'

        print(msg.strip())
        "

  - id: send_daily_report
    module: telegram.send_message
    params:
      chat_id: "{{ env.TELEGRAM_CHAT_ID }}"
      message: "{{ steps.format_telegram_message.output.stdout }}"

output:
  improvement_report: "{{ steps.parse_report.output }}"
  opportunities_analyzed: "{{ steps.parse_selected.output | length }}"
  auto_merged_count: "{{ steps.parse_report.output.deployment.auto_merged }}"
  dry_run: "{{ params.dry_run }}"
