name: "Create GitHub PR for Workflow Changes"
description: "Automatically create PR for AI-generated workflow improvements"

parameters:
  workflow_path:
    type: string
    required: true
    description: "Path to new/modified workflow"

  branch_name:
    type: string
    required: true
    description: "Branch name for PR"

  pr_title:
    type: string
    required: true
    description: "Pull request title"

  pr_description:
    type: string
    required: true
    description: "Pull request description"

  base_branch:
    type: string
    default: "main"
    description: "Base branch for PR"

steps:
  - id: read_workflow
    module: data.file.read
    params:
      file_path: "${params.workflow_path}"

  - id: create_branch
    module: api.github.create_branch
    params:
      owner: "flytohub"
      repo: "flyto2"
      branch: "${params.branch_name}"
      from_branch: "${params.base_branch}"
      token: "${env.GITHUB_TOKEN}"

  - id: commit_workflow
    module: api.github.create_commit
    params:
      owner: "flytohub"
      repo: "flyto2"
      branch: "${params.branch_name}"
      path: "${params.workflow_path}"
      content: "${read_workflow.content}"
      message: "AI-generated workflow update: ${params.pr_title}"
      token: "${env.GITHUB_TOKEN}"

  - id: create_pr
    module: api.github.create_pull_request
    params:
      owner: "flytohub"
      repo: "flyto2"
      title: "${params.pr_title}"
      body: |
        ${params.pr_description}

        ## AI-Generated Changes

        This PR was automatically generated by Flyto2 meta-workflow system.

        ### Review Checklist

        - [ ] Verify YAML syntax is valid
        - [ ] Check all module IDs exist
        - [ ] Confirm error handling is appropriate
        - [ ] Test workflow in sandbox
        - [ ] Review security implications
        - [ ] Verify no sensitive data exposed

        ### Testing

        ```bash
        python -m src.cli.main ${params.workflow_path}
        ```

        ---
        Generated by: workflows/meta/create_github_pr.yaml
        Timestamp: ${timestamp}
      head: "${params.branch_name}"
      base: "${params.base_branch}"
      token: "${env.GITHUB_TOKEN}"

  - id: notify_slack
    module: notification.slack.send_message
    if: "${env.SLACK_WEBHOOK_URL != null}"
    params:
      text: |
        New AI-generated workflow PR created

        Title: ${params.pr_title}
        Branch: ${params.branch_name}
        Workflow: ${params.workflow_path}
        PR: ${create_pr.html_url}
