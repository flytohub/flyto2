name: "Full Workflow Improvement Pipeline"
description: "Complete pipeline: analyze -> improve -> validate -> create PR"

parameters:
  target_workflow:
    type: string
    required: true
    description: "Workflow to improve"

  auto_create_pr:
    type: boolean
    default: false
    description: "Automatically create GitHub PR"

  llm_provider:
    type: string
    default: "openai"
    description: "LLM provider: openai or ollama"

  model:
    type: string
    default: "gpt-4"
    description: "Model to use"

steps:
  - id: analyze
    module: agent.autonomous
    params:
      llm_provider: "${params.llm_provider}"
      model: "${params.model}"
      goal: |
        Analyze this Flyto2 workflow and identify specific improvements:
        ${target_workflow}

        Focus on:
        1. Missing error handling
        2. Retry logic opportunities
        3. Timeout configurations
        4. Module usage optimization
        5. Structural improvements
      max_iterations: 5
      temperature: 0.3

  - id: read_dsl
    module: data.file.read
    params:
      file_path: "docs/DSL.md"

  - id: read_modules
    module: data.file.read
    params:
      file_path: "docs/MODULES.md"

  - id: read_workflow
    module: data.file.read
    params:
      file_path: "${params.target_workflow}"

  - id: generate_improved
    module: agent.chain
    params:
      llm_provider: "${params.llm_provider}"
      model: "${params.model}"
      input: "${analyze.result}"
      chain_steps:
        - |
          Based on this analysis: {input}

          DSL Spec: ${read_dsl.content}
          Modules: ${read_modules.content}
          Original: ${read_workflow.content}

          Generate specific improvements as a list.
        - |
          Take these improvements: {previous}

          Original workflow: ${read_workflow.content}

          Apply the improvements and output the complete refactored YAML.
          Output ONLY valid YAML, no explanations.
        - |
          Review this refactored YAML: {previous}

          Ensure:
          - All module IDs are valid
          - All parameters are correct
          - Error handling is present
          - Follows atomic composition pattern

          Output the final verified YAML.
      temperature: 0.2

  - id: save_improved
    module: data.file.write
    params:
      file_path: "workflows/_generated/${timestamp}_improved.yaml"
      content: "${generate_improved.result}"

  - id: validate_improved
    module: ai.openai.chat
    params:
      model: "gpt-3.5-turbo"
      temperature: 0
      system_message: |
        You are a Flyto2 YAML validator.
        Check if workflow is valid and follows best practices.
        Output JSON validation report.
      prompt: |
        Module Registry:
        ${read_modules.content}

        Generated Workflow:
        ${generate_improved.result}

        Validate and output JSON:
        {
          "valid": boolean,
          "errors": [],
          "warnings": [],
          "quality_score": 0-100
        }

  - id: save_validation
    module: data.file.write
    params:
      file_path: "workflows/_generated/${timestamp}_validation.json"
      content: "${validate_improved.response}"

  - id: create_pr_branch
    module: api.github.create_branch
    if: "${params.auto_create_pr == true}"
    params:
      owner: "flytohub"
      repo: "flyto2"
      branch: "auto-improve-${timestamp}"
      from_branch: "main"
      token: "${env.GITHUB_TOKEN}"

  - id: commit_improved
    module: api.github.create_commit
    if: "${params.auto_create_pr == true}"
    params:
      owner: "flytohub"
      repo: "flyto2"
      branch: "auto-improve-${timestamp}"
      path: "${params.target_workflow}"
      content: "${generate_improved.result}"
      message: "AI improvement: ${params.target_workflow}"
      token: "${env.GITHUB_TOKEN}"

  - id: create_pr
    module: api.github.create_pull_request
    if: "${params.auto_create_pr == true}"
    params:
      owner: "flytohub"
      repo: "flyto2"
      title: "AI-generated improvements for ${params.target_workflow}"
      body: |
        ## Analysis

        ${analyze.result}

        ## Improvements Applied

        ${generate_improved.intermediate_results[0]}

        ## Validation

        ${validate_improved.response}

        ## Review Required

        - [ ] Test workflow execution
        - [ ] Verify module usage
        - [ ] Check error handling
        - [ ] Approve or request changes

        ---
        Generated by: workflows/meta/full_improvement_pipeline.yaml
      head: "auto-improve-${timestamp}"
      base: "main"
      token: "${env.GITHUB_TOKEN}"

  - id: save_report
    module: data.file.write
    params:
      file_path: "workflows/_reports/${timestamp}_pipeline_report.md"
      content: |
        # Workflow Improvement Pipeline Report

        Target: ${params.target_workflow}
        Model: ${params.model}
        Provider: ${params.llm_provider}
        Timestamp: ${timestamp}

        ## Analysis

        ${analyze.result}

        ## Improvements

        ${generate_improved.intermediate_results[0]}

        ## Validation

        ${validate_improved.response}

        ## Generated Workflow

        Saved to: workflows/_generated/${timestamp}_improved.yaml

        ```yaml
        ${generate_improved.result}
        ```

        ## PR Status

        Auto PR: ${params.auto_create_pr}
        ${params.auto_create_pr ? 'PR URL: ' + create_pr.html_url : 'Manual PR creation required'}

        ## Next Steps

        1. Review generated workflow
        2. Test in sandbox environment
        3. Compare with original behavior
        4. ${params.auto_create_pr ? 'Review and merge PR' : 'Create PR manually if approved'}
