name: "Generate Workflow from Description"
description: "Use AI to generate new workflow YAML from natural language description"

parameters:
  description:
    type: string
    required: true
    description: "Natural language description of desired workflow"

  output_path:
    type: string
    required: true
    description: "Where to save generated workflow"

  llm_provider:
    type: string
    default: "openai"
    description: "LLM provider: openai or ollama"

  model:
    type: string
    default: "gpt-4"
    description: "Model to use for generation"

  validate_only:
    type: boolean
    default: false
    description: "Only validate, do not save"

steps:
  - id: read_dsl_spec
    module: data.file.read
    params:
      file_path: "docs/DSL.md"

  - id: get_module_registry
    module: meta.modules.list
    params:
      format: "markdown"
      include_params: true
      include_output: false

  - id: read_examples
    module: data.file.read
    params:
      file_path: "workflows/google_search.yaml"

  - id: generate_with_openai
    module: ai.openai.chat
    if: "${params.llm_provider == 'openai'}"
    params:
      model: "${params.model}"
      temperature: 0.2
      system_message: |
        You are a Flyto2 workflow engineer.
        Generate valid YAML workflows that follow Flyto2 DSL specification.

        Rules:
        - Output ONLY valid YAML, no explanations
        - Use only modules from the provided registry
        - Include proper error handling
        - Add comments for complex logic
        - Follow atomic module composition pattern
        - Keep coupling low between steps
      prompt: |
        DSL Specification:
        ---
        ${read_dsl_spec.content}

        Available Modules:
        ---
        ${get_module_registry.formatted}

        Example Workflow:
        ---
        ${read_examples.content}

        User Request:
        ---
        ${params.description}

        Generate a complete Flyto2 workflow YAML that fulfills this request.
        Output ONLY the YAML content, nothing else.

  - id: generate_with_ollama
    module: ai.local_ollama.chat
    if: "${params.llm_provider == 'ollama'}"
    params:
      model: "${params.model}"
      temperature: 0.2
      system_message: |
        You are a Flyto2 workflow engineer.
        Generate valid YAML workflows that follow Flyto2 DSL specification.

        Rules:
        - Output ONLY valid YAML, no explanations
        - Use only modules from the provided registry
        - Include proper error handling
        - Add comments for complex logic
        - Follow atomic module composition pattern
        - Keep coupling low between steps
      prompt: |
        DSL Specification:
        ---
        ${read_dsl_spec.content}

        Available Modules:
        ---
        ${get_module_registry.formatted}

        Example Workflow:
        ---
        ${read_examples.content}

        User Request:
        ---
        ${params.description}

        Generate a complete Flyto2 workflow YAML that fulfills this request.
        Output ONLY the YAML content, nothing else.

  - id: save_generated
    module: data.file.write
    if: "${params.validate_only == false}"
    params:
      file_path: "${params.output_path}"
      content: "${params.llm_provider == 'openai' ? generate_with_openai.response : generate_with_ollama.response}"

  - id: save_validation_report
    module: data.file.write
    params:
      file_path: "workflows/_generated/${timestamp}_report.md"
      content: |
        # Workflow Generation Report

        Request: ${params.description}
        Generated: ${timestamp}
        Model: ${params.model}
        Provider: ${params.llm_provider}
        Output: ${params.output_path}

        ## Generated YAML

        ```yaml
        ${params.llm_provider == 'openai' ? generate_with_openai.response : generate_with_ollama.response}
        ```

        ## Next Steps

        1. Review the generated YAML
        2. Run validation: python -m src.cli.main workflows/meta/validate_workflow.yaml --param target=${params.output_path}
        3. Test in sandbox mode
        4. Commit if approved
