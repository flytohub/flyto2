name: "List Modules Examples"
description: "Demonstration of meta.modules.list module capabilities"

steps:
  # Example 1: List all modules (JSON format)
  - id: list_all_json
    module: meta.modules.list
    params:
      format: "json"
      include_params: true
      include_output: true

  # Example 2: List only browser modules
  - id: list_browser
    module: meta.modules.list
    params:
      category: "browser"
      format: "markdown"

  # Example 3: List AI modules
  - id: list_ai
    module: meta.modules.list
    params:
      tags: ["ai", "llm"]
      format: "markdown"

  # Example 4: Compact list for AI prompts
  - id: list_compact
    module: meta.modules.list
    params:
      format: "compact"
      include_params: true

  # Example 5: Save module list for AI workflows
  - id: save_for_ai
    module: data.file.write
    params:
      file_path: "workflows/_generated/current_modules.md"
      content: "${list_compact.formatted}"

# This workflow demonstrates different ways to query the module registry
# Use these patterns in your meta-workflows to always get current module info
