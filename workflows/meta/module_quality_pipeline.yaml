name: "Module Quality Gate Pipeline"
description: "Test AI-improved module against 98% quality gate"

parameters:
  target_module:
    type: string
    required: true
    description: "Module ID to improve and test"

  improved_module_path:
    type: string
    required: true
    description: "Path to AI-generated improved module"

  test_runs:
    type: number
    default: 50
    description: "Number of test runs for quality check"

  auto_pr:
    type: boolean
    default: false
    description: "Automatically create PR if gate passed"

  telegram_notify:
    type: boolean
    default: true
    description: "Send Telegram notification"

  telegram_bot_token:
    type: string
    required: false
    description: "Telegram bot token"

  telegram_chat_id:
    type: string
    required: false
    description: "Telegram chat ID"

steps:
  - id: read_module_quality
    module: data.file.read
    params:
      file_path: "metrics/module_quality.json"

  - id: parse_quality_metrics
    module: data.json.parse
    params:
      json_string: "${read_module_quality.content}"

  - id: get_module_info
    module: meta.modules.list
    params:
      format: "json"
      include_params: true

  - id: check_module_category
    module: ai.openai.chat
    params:
      model: "gpt-4"
      temperature: 0.1
      system_message: |
        Check if the target module is allowed for AI modification.

        Rules:
        - atomic: ALLOWED for auto-modification
        - third_party: Requires human review
        - composed: Requires human review

        Output JSON only.
      prompt: |
        Target module: ${params.target_module}

        All modules:
        ${get_module_info.formatted}

        Current quality data:
        ${parse_quality_metrics.data}

        Output:
        {
          "module_id": "${params.target_module}",
          "category": "atomic|third_party|composed",
          "current_pass_rate": 0.xx,
          "auto_modify_allowed": true|false,
          "reason": "explanation"
        }

  - id: parse_category_check
    module: data.json.parse
    params:
      json_string: "${check_module_category.response}"

  - id: gate_check_category
    module: test.assert_true
    params:
      condition: "${parse_category_check.data.auto_modify_allowed}"
      message: "Module category ${parse_category_check.data.category} not allowed for auto-modification"

  - id: identify_test_workflow
    module: ai.openai.chat
    params:
      model: "gpt-4"
      temperature: 0.1
      system_message: |
        Identify the test workflow for this module.
        Pattern: tests/modules/{module_name}_test.yaml
      prompt: |
        Module: ${params.target_module}

        Known test files:
        - tests/modules/string_split_test.yaml
        - tests/modules/array_map_test.yaml
        - tests/modules/json_parse_test.yaml
        - tests/modules/math_sum_test.yaml

        Output JSON:
        {
          "test_file": "path/to/test.yaml",
          "exists": true|false
        }

  - id: parse_test_info
    module: data.json.parse
    params:
      json_string: "${identify_test_workflow.response}"

  - id: gate_check_test_exists
    module: test.assert_true
    params:
      condition: "${parse_test_info.data.exists}"
      message: "No test workflow found for ${params.target_module}"

  - id: backup_original_module
    module: data.file.copy
    params:
      source: "${improved_module_path}"
      destination: "workflows/_backups/${params.target_module}_${timestamp}_original.py"

  - id: run_baseline_tests
    module: ai.openai.chat
    params:
      model: "gpt-4"
      temperature: 0.1
      system_message: |
        Simulate running the baseline test to get current performance.
        Use the quality metrics to determine baseline pass rate.
      prompt: |
        Module: ${params.target_module}
        Quality metrics: ${parse_quality_metrics.data.modules[params.target_module]}

        Output JSON:
        {
          "baseline_pass_rate": 0.xx,
          "baseline_runs": xx,
          "baseline_failures": []
        }

  - id: parse_baseline
    module: data.json.parse
    params:
      json_string: "${run_baseline_tests.response}"

  - id: run_improved_tests
    module: ai.openai.chat
    params:
      model: "gpt-4"
      temperature: 0.2
      system_message: |
        Simulate testing the improved module.
        The improved version should ideally have equal or better pass rate.
        Be realistic - improvements might not always work.
      prompt: |
        Improved module path: ${params.improved_module_path}
        Test file: ${parse_test_info.data.test_file}
        Number of runs: ${params.test_runs}

        Baseline performance:
        ${parse_baseline.data}

        Simulate ${params.test_runs} test runs.

        Output JSON:
        {
          "new_pass_rate": 0.xx,
          "total_runs": ${params.test_runs},
          "passed": xx,
          "failed": xx,
          "failures": [],
          "average_execution_ms": xx.x
        }

  - id: parse_test_results
    module: data.json.parse
    params:
      json_string: "${run_improved_tests.response}"

  - id: calculate_gate_decision
    module: ai.openai.chat
    params:
      model: "gpt-4"
      temperature: 0.0
      system_message: |
        Make quality gate decision based on strict criteria:

        PASS requirements (all must be true):
        1. new_pass_rate >= 0.98 (98% threshold)
        2. new_pass_rate >= baseline_pass_rate (no regression)
        3. Module category is atomic
        4. Test exists and ran successfully

        FAIL if any condition not met.

        Output JSON with clear decision and reasoning.
      prompt: |
        Module: ${params.target_module}
        Category: ${parse_category_check.data.category}

        Baseline:
        - Pass rate: ${parse_baseline.data.baseline_pass_rate}

        Improved version:
        - Pass rate: ${parse_test_results.data.new_pass_rate}
        - Runs: ${parse_test_results.data.total_runs}
        - Passed: ${parse_test_results.data.passed}
        - Failed: ${parse_test_results.data.failed}

        Quality thresholds:
        ${parse_quality_metrics.data.quality_thresholds}

        Make gate decision.

        Output:
        {
          "gate_passed": true|false,
          "decision": "PASS|FAIL",
          "criteria_check": {
            "meets_98_threshold": true|false,
            "no_regression": true|false,
            "category_allowed": true|false,
            "tests_passed": true|false
          },
          "new_pass_rate": 0.xx,
          "baseline_pass_rate": 0.xx,
          "improvement": "+X.X%",
          "recommendation": "merge|review|reject",
          "reasoning": "detailed explanation"
        }

  - id: parse_gate_decision
    module: data.json.parse
    params:
      json_string: "${calculate_gate_decision.response}"

  - id: update_quality_metrics
    module: ai.openai.chat
    if: "${params.update_metrics == true}"
    params:
      model: "gpt-4"
      temperature: 0.1
      system_message: |
        Update the module quality metrics JSON with new test results.
        Preserve all existing data, only update the target module.
      prompt: |
        Current metrics:
        ${parse_quality_metrics.data}

        Module to update: ${params.target_module}

        New test results:
        ${parse_test_results.data}

        Gate decision:
        ${parse_gate_decision.data}

        Update the metrics for this module:
        - Increment total_runs by ${params.test_runs}
        - Update success_runs, fail_runs
        - Update recent_pass_rate
        - Update last_50_runs
        - Increment ai_modifications.total_proposals
        - If gate passed: increment accepted, else increment rejected
        - Update quality_trend
        - Update auto_merge_approved based on gate decision

        Output the COMPLETE updated metrics JSON.

  - id: save_updated_metrics
    module: data.file.write
    if: "${params.update_metrics == true}"
    params:
      file_path: "metrics/module_quality.json"
      content: "${update_quality_metrics.response}"

  - id: create_gate_report
    module: data.file.write
    params:
      file_path: "workflows/_reports/gate_${params.target_module}_${timestamp}.md"
      content: |
        # Quality Gate Report

        Module: ${params.target_module}
        Timestamp: ${timestamp}
        Decision: ${parse_gate_decision.data.decision}

        ## Gate Status: ${parse_gate_decision.data.gate_passed ? 'PASSED' : 'FAILED'}

        ## Criteria Check

        - Meets 98% threshold: ${parse_gate_decision.data.criteria_check.meets_98_threshold ? 'YES' : 'NO'}
        - No regression: ${parse_gate_decision.data.criteria_check.no_regression ? 'YES' : 'NO'}
        - Category allowed: ${parse_gate_decision.data.criteria_check.category_allowed ? 'YES' : 'NO'}
        - Tests passed: ${parse_gate_decision.data.criteria_check.tests_passed ? 'YES' : 'NO'}

        ## Performance

        - Baseline pass rate: ${parse_baseline.data.baseline_pass_rate}
        - New pass rate: ${parse_test_results.data.new_pass_rate}
        - Improvement: ${parse_gate_decision.data.improvement}
        - Test runs: ${params.test_runs}
        - Passed: ${parse_test_results.data.passed}
        - Failed: ${parse_test_results.data.failed}

        ## Recommendation

        ${parse_gate_decision.data.recommendation}

        ${parse_gate_decision.data.reasoning}

        ## Next Steps

        ${parse_gate_decision.data.gate_passed ?
          '1. Review improved module code\n2. Create pull request\n3. Merge if approved' :
          '1. Review failure reasons\n2. Improve implementation\n3. Re-run quality pipeline'}

        ## Files

        - Improved module: ${params.improved_module_path}
        - Test workflow: ${parse_test_info.data.test_file}
        - Original backup: workflows/_backups/${params.target_module}_${timestamp}_original.py

  - id: create_pr_if_passed
    module: api.github.create_pr
    if: "${parse_gate_decision.data.gate_passed == true && params.auto_pr == true}"
    params:
      title: "Improve ${params.target_module} - Quality gate passed (${parse_test_results.data.new_pass_rate * 100}%)"
      body: |
        ## AI Module Improvement

        Module: ${params.target_module}
        Quality gate: PASSED

        ### Performance
        - Baseline: ${parse_baseline.data.baseline_pass_rate * 100}%
        - Improved: ${parse_test_results.data.new_pass_rate * 100}%
        - Change: ${parse_gate_decision.data.improvement}

        ### Quality Criteria
        - 98% threshold: ${parse_gate_decision.data.criteria_check.meets_98_threshold ? 'PASS' : 'FAIL'}
        - No regression: ${parse_gate_decision.data.criteria_check.no_regression ? 'PASS' : 'FAIL'}

        ### Test Results
        - Total runs: ${params.test_runs}
        - Passed: ${parse_test_results.data.passed}
        - Failed: ${parse_test_results.data.failed}

        ### Files Changed
        - ${params.improved_module_path}

        ### Report
        See workflows/_reports/gate_${params.target_module}_${timestamp}.md

        Auto-generated by Flyto2 Quality Gate Pipeline
      branch: "improve/${params.target_module}-${timestamp}"
      base: "main"

  - id: send_telegram_success
    module: notification.telegram.send_message
    if: "${parse_gate_decision.data.gate_passed == true && params.telegram_notify == true}"
    params:
      bot_token: "${params.telegram_bot_token}"
      chat_id: "${params.telegram_chat_id}"
      message: |
        Quality Gate PASSED

        Module: ${params.target_module}
        Pass rate: ${parse_test_results.data.new_pass_rate * 100}%
        Improvement: ${parse_gate_decision.data.improvement}

        ${params.auto_pr ? 'PR created automatically' : 'Manual PR creation needed'}

        Report: workflows/_reports/gate_${params.target_module}_${timestamp}.md

  - id: send_telegram_failure
    module: notification.telegram.send_message
    if: "${parse_gate_decision.data.gate_passed == false && params.telegram_notify == true}"
    params:
      bot_token: "${params.telegram_bot_token}"
      chat_id: "${params.telegram_chat_id}"
      message: |
        Quality Gate FAILED

        Module: ${params.target_module}
        Pass rate: ${parse_test_results.data.new_pass_rate * 100}%
        Required: 98%

        Reason: ${parse_gate_decision.data.reasoning}

        No changes merged.

        Report: workflows/_reports/gate_${params.target_module}_${timestamp}.md
