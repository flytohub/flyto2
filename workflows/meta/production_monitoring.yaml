name: "Production Monitoring"
description: "Continuous monitoring of all modules in production"
category: "meta"

schedule:
  cron: "0 */1 * * *"  # Every hour

params:
  monitoring_window_hours:
    type: integer
    description: "Check modules deployed within N hours"
    default: 24

  send_healthy_report:
    type: boolean
    description: "Send Telegram notification even if all modules are healthy"
    default: false

steps:
  # Step 1: Get modules deployed in last 24h
  - id: get_recent_deployments
    module: bash.execute
    params:
      command: python scripts/deployment_manager.py monitoring-window {{ params.monitoring_window_hours }}

  - id: parse_recent_modules
    module: data.json.parse
    params:
      json_string: "{{ steps.get_recent_deployments.output.stdout }}"

  - id: count_recent_modules
    module: bash.execute
    params:
      command: |
        echo '{{ steps.parse_recent_modules.output | tojson }}' | python -c "
        import sys
        import json
        modules = json.load(sys.stdin)
        print(json.dumps({'count': len(modules), 'modules': modules}))
        "

  - id: parse_count
    module: data.json.parse
    params:
      json_string: "{{ steps.count_recent_modules.output.stdout }}"

  # Step 2: For each recent module, run quality check
  - id: check_module_quality
    module: workflow.execute
    params:
      workflow_path: "workflows/meta/auto_rollback_pipeline.yaml"
      params:
        module_id: "{{ item }}"
        monitoring_window_hours: "{{ params.monitoring_window_hours }}"
    for_each: "{{ steps.parse_count.output.modules }}"
    continue_on_error: true

  # Step 3: Load current module quality metrics
  - id: load_metrics
    module: file.read
    params:
      file_path: "metrics/module_quality.json"

  - id: parse_metrics
    module: data.json.parse
    params:
      json_string: "{{ steps.load_metrics.output }}"

  # Step 4: Load deployment history
  - id: load_history
    module: file.read
    params:
      file_path: "metrics/module_deployment_history.json"

  - id: parse_history
    module: data.json.parse
    params:
      json_string: "{{ steps.load_history.output }}"

  # Step 5: Generate health report
  - id: generate_health_report
    module: bash.execute
    params:
      command: |
        python -c "
        import json
        import sys

        metrics = {{ steps.parse_metrics.output | tojson }}
        history = {{ steps.parse_history.output | tojson }}
        rollback_results = {{ steps.check_module_quality.output | tojson }}

        summary = metrics.get('summary', {})

        # Count rollbacks from this monitoring run
        rollbacks_executed = sum(
          1 for result in rollback_results
          if result.get('output', {}).get('rollback_executed', False)
        ) if isinstance(rollback_results, list) else 0

        # Calculate health score (0-100)
        total_modules = summary.get('total_modules', 0)
        above_98 = summary.get('modules_above_98', 0)
        modules_95_98 = summary.get('modules_95_to_98', 0)
        below_95 = summary.get('modules_below_95', 0)

        if total_modules > 0:
          health_score = (
            (above_98 / total_modules * 100) +
            (modules_95_98 / total_modules * 50) +
            (below_95 / total_modules * 0)
          ) / 1.5  # Normalize to 0-100
        else:
          health_score = 100.0

        # Get recent stats from history
        global_stats = history.get('global_stats', {})

        report = {
          'timestamp': '{{ now() }}',
          'monitoring_window_hours': {{ params.monitoring_window_hours }},
          'module_stats': {
            'total_modules': total_modules,
            'above_98_percent': above_98,
            'between_95_98_percent': modules_95_98,
            'below_95_percent': below_95,
            'auto_merge_approved': summary.get('auto_merge_approved_count', 0)
          },
          'deployment_stats': {
            'total_deployments': global_stats.get('total_deployments', 0),
            'ai_deployments': global_stats.get('ai_deployments', 0),
            'human_deployments': global_stats.get('human_deployments', 0),
            'total_rollbacks': global_stats.get('rollbacks', 0),
            'rollback_rate': global_stats.get('rollback_rate', 0.0),
            'last_deployment': global_stats.get('last_deployment'),
            'last_rollback': global_stats.get('last_rollback')
          },
          'monitoring_results': {
            'modules_checked': len(rollback_results) if isinstance(rollback_results, list) else 0,
            'rollbacks_executed': rollbacks_executed,
            'modules_stable': (len(rollback_results) - rollbacks_executed) if isinstance(rollback_results, list) else 0
          },
          'health_score': round(health_score, 1),
          'status': 'healthy' if health_score >= 95 else 'needs_attention' if health_score >= 85 else 'critical'
        }

        print(json.dumps(report, indent=2))
        "

  - id: parse_health_report
    module: data.json.parse
    params:
      json_string: "{{ steps.generate_health_report.output.stdout }}"

  # Step 6: Determine if notification needed
  - id: should_notify
    module: bash.execute
    params:
      command: |
        python -c "
        import json
        report = {{ steps.parse_health_report.output | tojson }}
        monitoring = report.get('monitoring_results', {})
        send_healthy = {{ params.send_healthy_report | tojson }}

        # Send if:
        # 1. Rollbacks were executed
        # 2. Health status is not healthy
        # 3. send_healthy_report is true

        should_send = (
          monitoring.get('rollbacks_executed', 0) > 0 or
          report.get('status') != 'healthy' or
          send_healthy
        )

        print(json.dumps({'should_send': should_send}))
        "

  - id: parse_should_notify
    module: data.json.parse
    params:
      json_string: "{{ steps.should_notify.output.stdout }}"

  # Step 7: Send notification
  - id: format_message
    module: bash.execute
    params:
      command: |
        python -c "
        import json
        report = {{ steps.parse_health_report.output | tojson }}

        status = report['status']
        health_score = report['health_score']

        # Choose emoji based on status
        status_emoji = {
          'healthy': '✅',
          'needs_attention': '⚠️',
          'critical': '🚨'
        }.get(status, '❓')

        # Build message
        msg = f'''
        {status_emoji} **Production Health Report**

        **Overall Health**: {health_score}/100 ({status.replace('_', ' ').title()})

        **Module Quality**:
        • Total modules: {report['module_stats']['total_modules']}
        • Above 98%: {report['module_stats']['above_98_percent']} ✅
        • 95-98%: {report['module_stats']['between_95_98_percent']} ⚠️
        • Below 95%: {report['module_stats']['below_95_percent']} 🚨
        • Auto-merge approved: {report['module_stats']['auto_merge_approved']}

        **Deployment Stats**:
        • Total deployments: {report['deployment_stats']['total_deployments']}
        • AI deployments: {report['deployment_stats']['ai_deployments']}
        • Human deployments: {report['deployment_stats']['human_deployments']}
        • Rollback rate: {report['deployment_stats']['rollback_rate']:.1%}

        **Monitoring (last {report['monitoring_window_hours']}h)**:
        • Modules checked: {report['monitoring_results']['modules_checked']}
        • Rollbacks executed: {report['monitoring_results']['rollbacks_executed']} 🔄
        • Stable modules: {report['monitoring_results']['modules_stable']} ✅

        _Last update: {report['timestamp']}_
        '''

        print(msg.strip())
        "
    when: "{{ steps.parse_should_notify.output.should_send }}"

  - id: send_notification
    module: telegram.send_message
    params:
      chat_id: "{{ env.TELEGRAM_CHAT_ID }}"
      message: "{{ steps.format_message.output.stdout }}"
    when: "{{ steps.parse_should_notify.output.should_send }}"

output:
  health_report: "{{ steps.parse_health_report.output }}"
  notification_sent: "{{ steps.parse_should_notify.output.should_send }}"
  modules_checked: "{{ steps.parse_count.output.count }}"
  rollbacks_executed: "{{ steps.parse_health_report.output.monitoring_results.rollbacks_executed }}"
