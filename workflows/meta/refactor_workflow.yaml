name: "Refactor Existing Workflow"
description: "Use AI to refactor and improve existing workflow"

parameters:
  target_workflow:
    type: string
    required: true
    description: "Path to workflow to refactor"

  output_path:
    type: string
    required: true
    description: "Where to save refactored workflow"

  improvements:
    type: string
    default: "general"
    description: "Focus area: general, performance, error-handling, readability"

  llm_provider:
    type: string
    default: "openai"
    description: "LLM provider: openai or ollama"

  model:
    type: string
    default: "gpt-4"
    description: "Model to use"

steps:
  - id: read_dsl_spec
    module: data.file.read
    params:
      file_path: "docs/DSL.md"

  - id: read_module_registry
    module: data.file.read
    params:
      file_path: "docs/MODULES.md"

  - id: read_target
    module: data.file.read
    params:
      file_path: "${params.target_workflow}"

  - id: refactor_with_openai
    module: ai.openai.chat
    if: "${params.llm_provider == 'openai'}"
    params:
      model: "${params.model}"
      temperature: 0.2
      system_message: |
        You are a Flyto2 workflow refactoring expert.
        Improve existing workflows while maintaining their functionality.

        Refactoring principles:
        - Preserve original behavior
        - Improve error handling
        - Add retry logic where appropriate
        - Optimize module usage
        - Add helpful comments
        - Follow atomic composition pattern
        - Reduce coupling between steps
        - Use appropriate timeouts

        Output ONLY valid YAML.
      prompt: |
        DSL Specification:
        ---
        ${read_dsl_spec.content}

        Available Modules:
        ---
        ${read_module_registry.content}

        Current Workflow:
        ---
        ${read_target.content}

        Improvement Focus: ${params.improvements}

        Refactor this workflow with improvements focused on: ${params.improvements}
        Maintain the same functionality but make it better.
        Output ONLY the refactored YAML, no explanations.

  - id: refactor_with_ollama
    module: ai.local_ollama.chat
    if: "${params.llm_provider == 'ollama'}"
    params:
      model: "${params.model}"
      temperature: 0.2
      system_message: |
        You are a Flyto2 workflow refactoring expert.
        Improve existing workflows while maintaining their functionality.

        Refactoring principles:
        - Preserve original behavior
        - Improve error handling
        - Add retry logic where appropriate
        - Optimize module usage
        - Add helpful comments
        - Follow atomic composition pattern
        - Reduce coupling between steps
        - Use appropriate timeouts

        Output ONLY valid YAML.
      prompt: |
        DSL Specification:
        ---
        ${read_dsl_spec.content}

        Available Modules:
        ---
        ${read_module_registry.content}

        Current Workflow:
        ---
        ${read_target.content}

        Improvement Focus: ${params.improvements}

        Refactor this workflow with improvements focused on: ${params.improvements}
        Maintain the same functionality but make it better.
        Output ONLY the refactored YAML, no explanations.

  - id: save_refactored
    module: data.file.write
    params:
      file_path: "${params.output_path}"
      content: "${params.llm_provider == 'openai' ? refactor_with_openai.response : refactor_with_ollama.response}"

  - id: save_diff_report
    module: data.file.write
    params:
      file_path: "workflows/_refactored/${timestamp}_diff.md"
      content: |
        # Refactoring Report

        Original: ${params.target_workflow}
        Refactored: ${params.output_path}
        Focus: ${params.improvements}
        Model: ${params.model}
        Provider: ${params.llm_provider}
        Timestamp: ${timestamp}

        ## Original YAML

        ```yaml
        ${read_target.content}
        ```

        ## Refactored YAML

        ```yaml
        ${params.llm_provider == 'openai' ? refactor_with_openai.response : refactor_with_ollama.response}
        ```

        ## Next Steps

        1. Review changes carefully
        2. Test refactored workflow
        3. Compare outputs with original
        4. Create PR if approved
