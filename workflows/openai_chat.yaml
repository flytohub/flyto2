name: "AI Chat Interaction"
description: "Simple chat interaction with AI models (Anthropic Claude)"
version: "1.0.0"

params:
  prompt:
    type: string
    description: "User prompt to send to AI"
    default: "Explain what workflow automation is in 3 sentences."

  model:
    type: string
    description: "Claude model to use"
    default: "claude-3-sonnet-20240229"

config:
  required_env:
    - ANTHROPIC_API_KEY

steps:
  - id: chat_with_ai
    module: api.anthropic.chat
    params:
      messages:
        - role: "user"
          content: "${params.prompt}"
      model: "${params.model}"
      max_tokens: 500
      temperature: 0.7

  - id: display_response
    module: utility.delay
    params:
      seconds: 0
    # This step demonstrates output - actual display would be in output section

output:
  user_prompt: "${params.prompt}"
  ai_response: "${chat_with_ai.content}"
  model_used: "${params.model}"
  tokens_used: "${chat_with_ai.usage.total_tokens}"
