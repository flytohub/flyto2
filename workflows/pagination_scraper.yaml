# Pagination Scraper Example
# Demonstrates: Loop control, multi-page data extraction
# Use case: E-commerce product listings, search results, job boards

id: pagination-scraper
name: "Multi-Page Pagination Scraper"
version: "1.0.0"
description: "Scrape data across multiple pages with pagination"
author: "Flyto2 Team"
tags: ["pagination", "loop", "scraping", "example"]

# User parameters
params:
  - name: start_url
    type: string
    label: "Starting URL"
    description: "URL of the first page to scrape"
    required: true
    default: "https://example.com/products?page=1"

  - name: max_pages
    type: number
    label: "Maximum Pages"
    description: "Maximum number of pages to scrape"
    required: false
    default: 5
    min: 1
    max: 50

  - name: next_button_selector
    type: string
    label: "Next Button Selector"
    description: "CSS selector for the 'Next' button"
    required: false
    default: "a.next, button.next, [aria-label='Next']"

# Workflow configuration
config:
  browser:
    headless: true

# Workflow steps
steps:
  # === Browser Setup ===
  - id: launch_browser
    module: core.browser.launch
    description: "Launch browser"
    params:
      headless: true

  # === Navigate to Start URL ===
  - id: navigate
    module: core.browser.goto
    description: "Navigate to first page"
    params:
      browser: "${launch_browser.browser}"
      url: "${params.start_url}"
      wait_until: "networkidle"

  # === Initialize Results Array ===
  - id: init_results
    module: core.data.create
    description: "Initialize empty results array"
    params:
      value: []

  # === Pagination Loop ===
  # Note: This is a conceptual example - actual loop implementation
  # would use core.flow.loop module with page counter
  - id: page_1_extract
    module: core.browser.extract
    description: "Extract data from page 1"
    params:
      browser: "${launch_browser.browser}"
      selector: ".product-card, .item, .listing, .result"
      limit: 50
      fields:
        title:
          selector: "h2, .title, .product-name"
          type: "text"
        price:
          selector: ".price, .amount, .cost"
          type: "text"
        image:
          selector: "img"
          type: "attribute"
          attribute: "src"
        url:
          selector: "a"
          type: "attribute"
          attribute: "href"
        rating:
          selector: ".rating, .stars, .review-score"
          type: "text"

  # === Check if Next Button Exists ===
  - id: check_next_button
    module: core.browser.wait
    description: "Check if next button exists"
    params:
      browser: "${launch_browser.browser}"
      selector: "${params.next_button_selector}"
      timeout_ms: 3000
    on_error: "continue"  # Continue even if button not found

  # === Click Next Button (if exists) ===
  - id: click_next
    module: core.browser.click
    description: "Click next page button"
    if: "${check_next_button.found}"
    params:
      browser: "${launch_browser.browser}"
      selector: "${params.next_button_selector}"
    on_error: "continue"

  # === Wait for New Content ===
  - id: wait_new_content
    module: core.browser.wait
    description: "Wait for new page to load"
    if: "${check_next_button.found}"
    params:
      browser: "${launch_browser.browser}"
      selector: ".product-card, .item, .listing"
      timeout_ms: 10000

  # === Extract Page 2 ===
  - id: page_2_extract
    module: core.browser.extract
    description: "Extract data from page 2"
    if: "${check_next_button.found}"
    params:
      browser: "${launch_browser.browser}"
      selector: ".product-card, .item, .listing, .result"
      limit: 50
      fields:
        title:
          selector: "h2, .title, .product-name"
          type: "text"
        price:
          selector: ".price, .amount"
          type: "text"
        image:
          selector: "img"
          type: "attribute"
          attribute: "src"
        url:
          selector: "a"
          type: "attribute"
          attribute: "href"

  # === Advanced: Loop Example (Conceptual) ===
  # In production, use core.flow.loop with dynamic page counter
  # This example shows manual pagination for clarity

  # === Aggregate Results ===
  - id: aggregate_results
    module: core.data.merge
    description: "Combine results from all pages"
    params:
      arrays:
        - "${page_1_extract.data}"
        - "${page_2_extract.data}"

  # === Take Final Screenshot ===
  - id: screenshot
    module: core.browser.screenshot
    description: "Take screenshot of last page"
    params:
      browser: "${launch_browser.browser}"
      path: "pagination_final_${timestamp}.png"

  # === Close Browser ===
  - id: close_browser
    module: core.browser.close
    description: "Close browser"
    params:
      browser: "${launch_browser.browser}"

# Output
output:
  start_url: "${params.start_url}"
  total_items: "${aggregate_results.data.length}"
  pages_scraped: 2  # In real implementation, this would be dynamic
  all_items: "${aggregate_results.data}"
  screenshot: "${screenshot.filepath}"
  scraped_at: "${timestamp}"

# Notes for production use:
# 1. Replace manual page extraction with core.flow.loop
# 2. Add error handling for missing selectors
# 3. Implement rate limiting (delays between pages)
# 4. Add data validation and deduplication
# 5. Consider using API endpoints instead of scraping when available
