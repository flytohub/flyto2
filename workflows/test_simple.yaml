id: test_simple
name: Simple Test Workflow
description: Test basic workflow execution with HTTP and variable resolution
version: 1.0.0
author: Flyto2 Team

params:
  - name: test_url
    type: string
    description: URL to test
    default: https://api.github.com/zen

steps:
  - id: fetch_data
    module: core.api.http_get
    description: Fetch data from GitHub API
    params:
      url: ${params.test_url}
      timeout: 10

output:
  status_code: ${fetch_data.status_code}
  body: ${fetch_data.body}
  timestamp: ${timestamp}
  workflow_name: ${workflow.name}
